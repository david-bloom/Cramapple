<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--paper-000);font-family:var(--font-body);color:var(--text-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:5px 6px;font-size:10px;font-weight:700;letter-spacing:.02em}.lbl{display:block;font-size:10px;line-height:13px;color:var(--ink-500);font-weight:600}.row{display:flex;gap:14px;align-items:flex-end}</style></head><body><div class="row" style="gap:14px">
<div style="width:120px;height:64px;background:#fff;border:1px solid var(--rule-300);box-shadow:var(--shadow-pane);display:flex;align-items:center;justify-content:center;font-size:12px">pane</div>
<div style="padding:11px 20px;background:var(--orange-700);color:#fff;font-size:16px;font-weight:600">button</div>
<div style="padding:3px 9px;background:var(--blue-050);border:1px solid var(--blue-100);color:var(--blue-600);font-size:12px;font-weight:600">chip</div>
<div style="width:18px;height:18px;border:2px solid var(--purple-600);border-radius:50%;display:flex;align-items:center;justify-content:center"><span style="width:8px;height:8px;border-radius:50%;background:var(--purple-600)"></span></div>
<div class="lbl" style="max-width:180px">↑ the only radius in the product</div>
</div></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--paper-000);font-family:var(--font-body);color:var(--text-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:5px 6px;font-size:10px;font-weight:700;letter-spacing:.02em}.lbl{display:block;font-size:10px;line-height:13px;color:var(--ink-500);font-weight:600}.row{display:flex;gap:14px;align-items:flex-end}</style></head><body><div style="display:grid;gap:10px;max-width:420px">
<div style="background:#fff;border:2px solid var(--purple-600);padding:10px 14px;display:flex;gap:12px;align-items:center"><span style="width:18px;height:18px;border:2px solid var(--purple-600);border-radius:50%;display:inline-flex;align-items:center;justify-content:center"><span style="width:8px;height:8px;border-radius:50%;background:var(--purple-600)"></span></span><span style="font-size:16px;font-weight:600">Selected — border + dot + bolder label, never a wash</span></div>
<div style="display:flex;gap:14px;align-items:center"><span style="padding:11px 20px;background:var(--action-primary-disabled);color:#fff;font-size:16px;font-weight:600;cursor:not-allowed">Disabled — desaturated fill, not opacity</span></div>
<div style="font-size:16px;color:var(--maroon-500);text-decoration:line-through;opacity:.55">Eliminated — clay ink, struck, 55%</div>
<div class="lbl">No transitions, no fades, no bounces. State changes are instant: read → decide → see.</div>
</div></body></html>

<!-- @dsCard group="Colors" viewport="700x140" name="Correction & accent" subtitle="Maroon for lost points, clay for revisit, teal for deep dive" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--paper-000);font-family:var(--font-body);color:var(--text-body)}.sw{display:flex;gap:0}.sw>div{flex:1;height:56px;display:flex;align-items:flex-end;padding:5px 6px;font-size:10px;font-weight:700}.lbl{display:block;font-size:10px;line-height:13px;color:var(--ink-500);font-weight:600}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px">
<div><div class="sw"><div style="background:var(--maroon-050);color:var(--ink-700)">050</div><div style="background:var(--maroon-300);color:var(--ink-700)">300</div><div style="background:var(--maroon-500);color:#fff">500</div><div style="background:var(--maroon-600);color:#fff">600</div><div style="background:var(--maroon-700);color:#fff">700</div></div><div class="lbl" style="margin-top:5px">Maroon — incorrect verdicts, points lost, eliminated options. Cool enough never to read as the brand orange.</div></div>
<div><div class="sw"><div style="background:var(--clay-050);color:var(--ink-700)">050</div><div style="background:var(--clay-300);color:var(--ink-700)">300</div><div style="background:var(--clay-500);color:#fff">500</div><div style="background:var(--clay-600);color:#fff">600</div></div><div class="lbl" style="margin-top:5px">Clay #8c4530 — the ↻ revisit mark. Come back to this; the point is still available.</div></div>
<div><div class="sw"><div style="background:var(--teal-500);color:#fff">500</div><div style="background:var(--teal-600);color:#fff">600</div></div><div class="lbl" style="margin-top:5px">Teal — one accent rule inside the deep dive. Nowhere else.</div></div>
</div></body></html>

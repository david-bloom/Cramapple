<!-- @dsCard group="Colors" viewport="700x188" subtitle="Five colors, five jobs — red brand, blue rubric, green reference, yellow hints, purple student work" name="Brand & voices" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Passion+One:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--paper-000);font-family:var(--font-ui);color:var(--text-body);padding:18px 20px}
.eye{font:var(--eyebrow);letter-spacing:var(--eyebrow-tracking);text-transform:uppercase}
.head{font-family:var(--font-head)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:104px}
.chip{height:56px;border:1px solid var(--rule-300)}
.lbl{font-size:12px;font-weight:700;margin-top:5px;color:var(--text-body)}
.hex{font-size:11px;color:var(--text-muted);letter-spacing:.02em}
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--red-500)"></div><div class="lbl">Brand</div><div class="hex">#F5442E</div></div>
  <div class="sw"><div class="chip" style="background:var(--blue-600)"></div><div class="lbl">Rubric</div><div class="hex">#2B6CB0</div></div>
  <div class="sw"><div class="chip" style="background:var(--green-500)"></div><div class="lbl">Reference</div><div class="hex">#57A03C</div></div>
  <div class="sw"><div class="chip" style="background:var(--yellow-500)"></div><div class="lbl">Hint</div><div class="hex">#F5B301</div></div>
  <div class="sw"><div class="chip" style="background:var(--purple-600)"></div><div class="lbl">Student work</div><div class="hex">#5B45A6</div></div>
  <div class="sw"><div class="chip" style="background:var(--teal-500)"></div><div class="lbl">Deep accent</div><div class="hex">#0FB5A6</div></div>
</div>
</body>
</html>

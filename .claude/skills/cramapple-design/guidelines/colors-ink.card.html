<!-- @dsCard group="Colors" viewport="700x188" subtitle="ink-300 is decorative only — it fails contrast as text" name="Ink" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Passion+One:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--paper-000);font-family:var(--font-ui);color:var(--text-body);padding:18px 20px}
.eye{font:var(--eyebrow);letter-spacing:var(--eyebrow-tracking);text-transform:uppercase}
.head{font-family:var(--font-head)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:104px}
.chip{height:56px;border:1px solid var(--rule-300)}
.lbl{font-size:12px;font-weight:700;margin-top:5px;color:var(--text-body)}
.hex{font-size:11px;color:var(--text-muted);letter-spacing:.02em}
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="lbl">Body</div><div class="hex">#16232A</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-800)"></div><div class="lbl">Prose</div><div class="hex">#23201A</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-600)"></div><div class="lbl">Secondary</div><div class="hex">#3A4750</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="lbl">Muted</div><div class="hex">#5C6A6E</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-400)"></div><div class="lbl">Eyebrow</div><div class="hex">#9AA6AA</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-300)"></div><div class="lbl">Decorative</div><div class="hex">#B4AE9E</div></div>
</div>
</body>
</html>

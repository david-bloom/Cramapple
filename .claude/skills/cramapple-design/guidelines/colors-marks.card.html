<!-- @dsCard group="Colors" viewport="700x188" subtitle="Credit is blue, revisit is amber, lost and eliminated are clay — never brand red" name="Scoring marks" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Passion+One:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--paper-000);font-family:var(--font-ui);color:var(--text-body);padding:18px 20px}
.eye{font:var(--eyebrow);letter-spacing:var(--eyebrow-tracking);text-transform:uppercase}
.head{font-family:var(--font-head)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:104px}
.chip{height:56px;border:1px solid var(--rule-300)}
.lbl{font-size:12px;font-weight:700;margin-top:5px;color:var(--text-body)}
.hex{font-size:11px;color:var(--text-muted);letter-spacing:.02em}
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--blue-600)"></div><div class="lbl">Credit ✓</div><div class="hex">#2B6CB0</div></div>
  <div class="sw"><div class="chip" style="background:var(--amber-600)"></div><div class="lbl">Revisit ↻</div><div class="hex">#B5870B</div></div>
  <div class="sw"><div class="chip" style="background:var(--clay-600)"></div><div class="lbl">Lost / out</div><div class="hex">#B5502F</div></div>
  <div class="sw"><div class="chip" style="background:var(--clay-700)"></div><div class="lbl">Correction ink</div><div class="hex">#8A4030</div></div>
  <div class="sw"><div class="chip" style="background:var(--clay-paper)"></div><div class="lbl">Lost field</div><div class="hex">#FBF1ED</div></div>
  <div class="sw"><div class="chip" style="background:var(--clay-rule)"></div><div class="lbl">Lost rule</div><div class="hex">#E0B9AC</div></div>
</div>
</body>
</html>

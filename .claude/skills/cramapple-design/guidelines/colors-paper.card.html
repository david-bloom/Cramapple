<!-- @dsCard group="Colors" viewport="700x188" subtitle="White plates on a warm desk; tinted fields name their voice" name="Paper & fields" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Passion+One:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--paper-000);font-family:var(--font-ui);color:var(--text-body);padding:18px 20px}
.eye{font:var(--eyebrow);letter-spacing:var(--eyebrow-tracking);text-transform:uppercase}
.head{font-family:var(--font-head)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:104px}
.chip{height:56px;border:1px solid var(--rule-300)}
.lbl{font-size:12px;font-weight:700;margin-top:5px;color:var(--text-body)}
.hex{font-size:11px;color:var(--text-muted);letter-spacing:.02em}
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--paper-000)"></div><div class="lbl">Plate</div><div class="hex">#FFFFFF</div></div>
  <div class="sw"><div class="chip" style="background:var(--paper-050)"></div><div class="lbl">Chrome</div><div class="hex">#FBFAF6</div></div>
  <div class="sw"><div class="chip" style="background:var(--paper-100)"></div><div class="lbl">Desk</div><div class="hex">#F3F0E9</div></div>
  <div class="sw"><div class="chip" style="background:var(--purple-tint-06)"></div><div class="lbl">Answer</div><div class="hex">purple .06</div></div>
  <div class="sw"><div class="chip" style="background:var(--purple-paper)"></div><div class="lbl">Feedback</div><div class="hex">#FAF8FE</div></div>
  <div class="sw"><div class="chip" style="background:var(--yellow-paper)"></div><div class="lbl">Hint</div><div class="hex">#FFFAEC</div></div>
</div>
</body>
</html>

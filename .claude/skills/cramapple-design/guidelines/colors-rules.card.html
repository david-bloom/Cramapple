<!-- @dsCard group="Colors" viewport="700x150" subtitle="Warm greys for structure; the purple and blue rules belong to their own surfaces" name="Rules & hairlines" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Passion+One:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--paper-000);font-family:var(--font-ui);color:var(--text-body);padding:18px 20px}
.eye{font:var(--eyebrow);letter-spacing:var(--eyebrow-tracking);text-transform:uppercase}
.head{font-family:var(--font-head)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:104px}
.chip{height:56px;border:1px solid var(--rule-300)}
.lbl{font-size:12px;font-weight:700;margin-top:5px;color:var(--text-body)}
.hex{font-size:11px;color:var(--text-muted);letter-spacing:.02em}
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--rule-100)"></div><div class="lbl">Divider</div><div class="hex">#F0ECE3</div></div>
  <div class="sw"><div class="chip" style="background:var(--rule-300)"></div><div class="lbl">Border</div><div class="hex">#E7E2D8</div></div>
  <div class="sw"><div class="chip" style="background:var(--rule-350)"></div><div class="lbl">Card</div><div class="hex">#E6E1D6</div></div>
  <div class="sw"><div class="chip" style="background:var(--rule-400)"></div><div class="lbl">Quiet button</div><div class="hex">#D8D2C6</div></div>
  <div class="sw"><div class="chip" style="background:var(--purple-rule)"></div><div class="lbl">Answer rule</div><div class="hex">#E6E1F0</div></div>
  <div class="sw"><div class="chip" style="background:var(--yellow-rule)"></div><div class="lbl">Hint rule</div><div class="hex">#F0D48A</div></div>
</div>
</body>
</html>

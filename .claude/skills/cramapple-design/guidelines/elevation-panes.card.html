<!-- @dsCard group="Brand" viewport="700x210" subtitle="Square corners, hairline border, colored top rule naming the voice" name="Panes & plates" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Passion+One:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--paper-000);font-family:var(--font-ui);color:var(--text-body);padding:18px 20px}
.eye{font:var(--eyebrow);letter-spacing:var(--eyebrow-tracking);text-transform:uppercase}
.head{font-family:var(--font-head)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:104px}
.chip{height:56px;border:1px solid var(--rule-300)}
.lbl{font-size:12px;font-weight:700;margin-top:5px;color:var(--text-body)}
.hex{font-size:11px;color:var(--text-muted);letter-spacing:.02em}
</style>
</head>
<body>

<div style="display:flex;gap:16px">
  <div style="width:200px;background:var(--paper-000);border:1px solid var(--rule-300);border-top:3px solid var(--blue-600);box-shadow:var(--shadow-pane);padding:12px 14px">
    <div class="head" style="font-size:26px;line-height:1">Rubric</div>
    <div style="font:var(--micro);color:var(--text-muted);margin-top:4px">blue cap · shadow-pane</div>
  </div>
  <div style="width:200px;background:var(--paper-000);border:2px solid var(--red-500);box-shadow:var(--shadow-section);padding:12px 14px">
    <div class="eye" style="color:var(--text-eyebrow)">Question</div>
    <div style="font:var(--micro);color:var(--text-muted);margin-top:4px">red outline · shadow-section</div>
  </div>
  <div style="width:200px;background:var(--paper-000);border:1px solid var(--rule-300);border-top:3px solid var(--green-500);box-shadow:var(--shadow-pane);padding:12px 14px">
    <div class="head" style="font-size:22px;line-height:1.05">Reference</div>
    <div style="font:var(--micro);color:var(--text-muted);margin-top:4px">green cap</div>
  </div>
</div>
</body>
</html>

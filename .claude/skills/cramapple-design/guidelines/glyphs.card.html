<!-- @dsCard group="Brand" viewport="700x150" subtitle="No icon library, no emoji — typographic glyphs plus two inline stroke SVGs" name="Glyph vocabulary" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Passion+One:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--paper-000);font-family:var(--font-ui);color:var(--text-body);padding:18px 20px}
.eye{font:var(--eyebrow);letter-spacing:var(--eyebrow-tracking);text-transform:uppercase}
.head{font-family:var(--font-head)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:104px}
.chip{height:56px;border:1px solid var(--rule-300)}
.lbl{font-size:12px;font-weight:700;margin-top:5px;color:var(--text-body)}
.hex{font-size:11px;color:var(--text-muted);letter-spacing:.02em}
</style>
</head>
<body>

<div style="display:flex;gap:26px;align-items:center;flex-wrap:wrap;font:var(--body)">
  
  <div style="text-align:center"><div style="font-size:22px;color:var(--ink-900)">✓</div><div class="hex" style="margin-top:4px">credit</div></div>
  <div style="text-align:center"><div style="font-size:22px;color:var(--ink-900)">✕</div><div class="hex" style="margin-top:4px">take point</div></div>
  <div style="text-align:center"><div style="font-size:22px;color:var(--ink-900)">↻</div><div class="hex" style="margin-top:4px">revisit</div></div>
  <div style="text-align:center"><div style="font-size:22px;color:var(--ink-900)">?</div><div class="hex" style="margin-top:4px">hint</div></div>
  <div style="text-align:center"><div style="font-size:22px;color:var(--ink-900)">▸</div><div class="hex" style="margin-top:4px">open</div></div>
  <div style="text-align:center"><div style="font-size:22px;color:var(--ink-900)">▼</div><div class="hex" style="margin-top:4px">menu</div></div>
  <div style="text-align:center"><div style="font-size:22px;color:var(--ink-900)">⌂</div><div class="hex" style="margin-top:4px">home</div></div>
  <div style="text-align:center"><div style="font-size:22px;color:var(--ink-900)">·</div><div class="hex" style="margin-top:4px">separator</div></div>
  <div style="text-align:center;color:var(--purple-600)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h3.5l1.6-2.2h7.8L17.5 8H21v11H3z"></path><circle cx="12" cy="13.2" r="3.6"></circle></svg><div class="hex" style="margin-top:4px">attach</div></div>
  <div style="text-align:center;color:var(--ink-500)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg><div class="hex" style="margin-top:4px">copy</div></div>
</div>
</body>
</html>

<!-- @dsCard group="Brand" viewport="700x330" subtitle="Idle → cost surfaced → receipt. A hint is never free and never silent." name="Hint economy" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Passion+One:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--paper-000);font-family:var(--font-ui);color:var(--text-body);padding:18px 20px}
.eye{font:var(--eyebrow);letter-spacing:var(--eyebrow-tracking);text-transform:uppercase}
.head{font-family:var(--font-head)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:104px}
.chip{height:56px;border:1px solid var(--rule-300)}
.lbl{font-size:12px;font-weight:700;margin-top:5px;color:var(--text-body)}
.hex{font-size:11px;color:var(--text-muted);letter-spacing:.02em}
</style>
</head>
<body>

<div style="display:flex;flex-direction:column;gap:10px;max-width:400px">
  <div style="background:var(--yellow-paper);border:1px solid var(--yellow-rule);border-left:var(--accent-rule) solid var(--yellow-500);padding:11px 13px;display:flex;align-items:center;justify-content:space-between;gap:10px">
    <span style="display:flex;flex-direction:column;gap:2px">
      <span class="eye" style="color:var(--yellow-ink)">Hint</span>
      <span style="font:var(--body-strong)">Show me the rubric</span>
    </span>
    <span style="flex-shrink:0;width:28px;height:28px;background:var(--yellow-500);color:var(--yellow-on);display:flex;align-items:center;justify-content:center;font:var(--body-strong)">?</span>
  </div>
  <div style="background:var(--yellow-paper);border:1px solid var(--yellow-rule);border-left:var(--accent-rule) solid var(--yellow-500);padding:11px 13px;display:flex;flex-direction:column;gap:8px">
    <span style="font:var(--body-strong)">Sure you need a hint?</span>
    <span style="font:var(--body);font-size:14px;color:var(--yellow-ink-soft)">It shows exactly what the reader is looking for.</span>
    <span style="display:flex;align-items:center;gap:12px">
      <span style="font:var(--control-strong);background:var(--yellow-500);color:var(--yellow-on);padding:8px 14px;white-space:nowrap">Yes, show me</span>
      <span style="font:var(--control);color:var(--yellow-ink);text-decoration:underline;text-underline-offset:3px">No, keep solving</span>
    </span>
  </div>
  <div style="background:var(--yellow-paper);border:1px solid var(--yellow-rule);border-left:var(--accent-rule) solid var(--yellow-500);padding:11px 13px;display:flex;align-items:center;justify-content:space-between;gap:10px">
    <span class="eye" style="color:var(--yellow-ink)">Hint used · Rubric</span>
    <span style="font:var(--control);color:var(--yellow-ink);text-decoration:underline;text-underline-offset:3px">Hide</span>
  </div>
</div>
</body>
</html>

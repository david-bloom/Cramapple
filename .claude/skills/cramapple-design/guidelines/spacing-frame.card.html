<!-- @dsCard group="Spacing" viewport="700x260" subtitle="1440×900, fixed — three panes, 40px gutters, no scrolling anywhere" name="The plate" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Passion+One:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--paper-000);font-family:var(--font-ui);color:var(--text-body);padding:18px 20px}
.eye{font:var(--eyebrow);letter-spacing:var(--eyebrow-tracking);text-transform:uppercase}
.head{font-family:var(--font-head)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:104px}
.chip{height:56px;border:1px solid var(--rule-300)}
.lbl{font-size:12px;font-weight:700;margin-top:5px;color:var(--text-body)}
.hex{font-size:11px;color:var(--text-muted);letter-spacing:.02em}
</style>
</head>
<body>

<div style="width:660px;border:1px solid var(--rule-300);background:var(--paper-100)">
  <div style="height:26px;background:var(--red-500)"></div>
  <div style="height:18px;background:var(--paper-050);border-bottom:1px solid var(--rule-200)"></div>
  <div style="padding:9px 18px;display:grid;grid-template-columns:161px minmax(0,1fr) 148px;gap:9px">
    <div style="height:150px;background:var(--paper-000);border:1px solid var(--rule-300);border-top:3px solid var(--blue-600)"></div>
    <div style="height:150px;background:var(--paper-000);border:2px solid var(--red-500)"></div>
    <div style="height:150px;background:var(--paper-000);border:1px solid var(--rule-300);border-top:3px solid var(--green-500)"></div>
  </div>
  <div style="height:14px"></div>
</div>
<div style="font:var(--micro);color:var(--text-muted);margin-top:8px">352 · fluid · 324 at 20px gaps · masthead 70 · breadcrumb 48</div>
</body>
</html>

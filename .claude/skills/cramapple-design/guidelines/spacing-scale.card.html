<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Odd steps are intentional — copy exact values, never snap to a 4/8 grid" name="Scale" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Passion+One:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--paper-000);font-family:var(--font-ui);color:var(--text-body);padding:18px 20px}
.eye{font:var(--eyebrow);letter-spacing:var(--eyebrow-tracking);text-transform:uppercase}
.head{font-family:var(--font-head)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:104px}
.chip{height:56px;border:1px solid var(--rule-300)}
.lbl{font-size:12px;font-weight:700;margin-top:5px;color:var(--text-body)}
.hex{font-size:11px;color:var(--text-muted);letter-spacing:.02em}
</style>
</head>
<body>

<div style="display:flex;align-items:flex-end;gap:12px">
  
  <div style="text-align:center"><div style="width:4px;height:4px;background:var(--purple-600)"></div><div class="hex" style="margin-top:6px">4px</div></div>
  <div style="text-align:center"><div style="width:5px;height:5px;background:var(--purple-600)"></div><div class="hex" style="margin-top:6px">5px</div></div>
  <div style="text-align:center"><div style="width:7px;height:7px;background:var(--purple-600)"></div><div class="hex" style="margin-top:6px">7px</div></div>
  <div style="text-align:center"><div style="width:9px;height:9px;background:var(--purple-600)"></div><div class="hex" style="margin-top:6px">9px</div></div>
  <div style="text-align:center"><div style="width:11px;height:11px;background:var(--purple-600)"></div><div class="hex" style="margin-top:6px">11px</div></div>
  <div style="text-align:center"><div style="width:12px;height:12px;background:var(--purple-600)"></div><div class="hex" style="margin-top:6px">12px</div></div>
  <div style="text-align:center"><div style="width:14px;height:14px;background:var(--purple-600)"></div><div class="hex" style="margin-top:6px">14px</div></div>
  <div style="text-align:center"><div style="width:16px;height:16px;background:var(--purple-600)"></div><div class="hex" style="margin-top:6px">16px</div></div>
  <div style="text-align:center"><div style="width:20px;height:20px;background:var(--purple-600)"></div><div class="hex" style="margin-top:6px">20px</div></div>
  <div style="text-align:center"><div style="width:26px;height:26px;background:var(--purple-600)"></div><div class="hex" style="margin-top:6px">26px</div></div>
</div>
</body>
</html>

<!-- @dsCard group="Brand" viewport="700x190" subtitle="One primary per screen; secondary is always a text link; disabled is desaturated, not faded" name="Actions" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Passion+One:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--paper-000);font-family:var(--font-ui);color:var(--text-body);padding:18px 20px}
.eye{font:var(--eyebrow);letter-spacing:var(--eyebrow-tracking);text-transform:uppercase}
.head{font-family:var(--font-head)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:104px}
.chip{height:56px;border:1px solid var(--rule-300)}
.lbl{font-size:12px;font-weight:700;margin-top:5px;color:var(--text-body)}
.hex{font-size:11px;color:var(--text-muted);letter-spacing:.02em}
</style>
</head>
<body>

<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
  <button style="font:var(--control-strong);letter-spacing:.02em;background:var(--action-primary-bg);color:var(--action-primary-fg);border:2px solid var(--action-primary-bg);padding:12px 22px;cursor:pointer">Submit answer</button>
  <button style="font:var(--control-strong);background:var(--action-primary-disabled);color:var(--action-primary-fg);border:2px solid var(--action-primary-disabled);padding:12px 22px;cursor:not-allowed">Submit answer</button>
  <button style="font:var(--control-strong);background:var(--action-hint-bg);color:var(--action-hint-fg);border:2px solid var(--action-hint-bg);padding:8px 16px;cursor:pointer">Yes, show me</button>
  <a href="#" style="font:var(--control);color:var(--action-secondary-fg);text-decoration:underline;text-underline-offset:3px">Skip to the next question</a>
  <button style="font:var(--eyebrow);letter-spacing:.06em;text-transform:uppercase;background:var(--paper-000);color:var(--action-quiet-fg);border:1.5px solid var(--action-quiet-border);padding:7px 14px;cursor:pointer">Close ✕</button>
</div>
</body>
</html>

<!-- @dsCard group="Brand" viewport="700x230" subtitle="Selection is border + dot + weight, never a background wash" name="Selection & marks" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Passion+One:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--paper-000);font-family:var(--font-ui);color:var(--text-body);padding:18px 20px}
.eye{font:var(--eyebrow);letter-spacing:var(--eyebrow-tracking);text-transform:uppercase}
.head{font-family:var(--font-head)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:104px}
.chip{height:56px;border:1px solid var(--rule-300)}
.lbl{font-size:12px;font-weight:700;margin-top:5px;color:var(--text-body)}
.hex{font-size:11px;color:var(--text-muted);letter-spacing:.02em}
</style>
</head>
<body>

<div style="display:flex;flex-direction:column;gap:9px;max-width:620px">
  <div style="border:2px solid var(--purple-600);background:var(--paper-000);padding:9px 12px;display:grid;grid-template-columns:22px 20px minmax(0,1fr);gap:0 11px;align-items:start">
    <span style="margin-top:1px;width:20px;height:20px;border-radius:var(--radius-round);border:2px solid var(--purple-600);display:flex;align-items:center;justify-content:center"><span style="width:10px;height:10px;border-radius:var(--radius-round);background:var(--purple-600)"></span></span>
    <span class="head" style="font-size:21px;line-height:1;color:var(--purple-600)">B</span>
    <span style="font:var(--body-strong)">Selected option — purple border, filled dot, bold label</span>
  </div>
  <div style="border:1px solid var(--rule-350);background:var(--paper-000);padding:9px 12px;display:grid;grid-template-columns:22px 20px minmax(0,1fr);gap:0 11px;align-items:start">
    <span style="margin-top:1px;width:20px;height:20px;border-radius:var(--radius-round);border:2px solid var(--rule-500)"></span>
    <span class="head" style="font-size:21px;line-height:1;color:var(--ink-600)">C</span>
    <span style="font:var(--body)">Unselected option — ink letter, hairline border</span>
  </div>
  <div style="display:flex;gap:14px;align-items:center;padding-top:2px">
    <span style="width:26px;height:26px;border:2px solid var(--mark-credit);color:var(--mark-credit);display:flex;align-items:center;justify-content:center;font:var(--control-strong)">✓</span>
    <span style="width:26px;height:26px;border:2px solid var(--mark-revisit);color:var(--mark-revisit);display:flex;align-items:center;justify-content:center;font:var(--control-strong)">↻</span>
    <span style="font:var(--body);color:var(--text-secondary)">Credit and revisit. A missed point is ↻, never ✕.</span>
  </div>
</div>
</body>
</html>

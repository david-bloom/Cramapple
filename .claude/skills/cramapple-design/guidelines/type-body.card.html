<!-- @dsCard group="Type" viewport="700x230" subtitle="16px is the floor for anything a student reads to answer" name="Body & question" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Passion+One:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--paper-000);font-family:var(--font-ui);color:var(--text-body);padding:18px 20px}
.eye{font:var(--eyebrow);letter-spacing:var(--eyebrow-tracking);text-transform:uppercase}
.head{font-family:var(--font-head)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:104px}
.chip{height:56px;border:1px solid var(--rule-300)}
.lbl{font-size:12px;font-weight:700;margin-top:5px;color:var(--text-body)}
.hex{font-size:11px;color:var(--text-muted);letter-spacing:.02em}
</style>
</head>
<body>

<div style="display:flex;flex-direction:column;gap:12px;max-width:620px">
  <div style="font:var(--question)">Which statement interprets the slope correctly?</div>
  <div style="font:var(--body-lg)">Coaching paragraph, 17px — you read the slope as a predicted average change, per one hour, with both variables named.</div>
  <div style="font:var(--body)">Body copy, 16px. Every explanation, rule and option label sits here.</div>
  <div><span style="font:var(--body-strong)">Bold body, 16px</span> <span style="font:var(--body);color:var(--text-secondary)">— used for a mark label before its note.</span></div>
</div>
</body>
</html>

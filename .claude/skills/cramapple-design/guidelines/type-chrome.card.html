<!-- @dsCard group="Type" viewport="700x200" subtitle="The only type allowed below 16px — never for answerable content" name="Chrome & eyebrows" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Passion+One:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--paper-000);font-family:var(--font-ui);color:var(--text-body);padding:18px 20px}
.eye{font:var(--eyebrow);letter-spacing:var(--eyebrow-tracking);text-transform:uppercase}
.head{font-family:var(--font-head)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:104px}
.chip{height:56px;border:1px solid var(--rule-300)}
.lbl{font-size:12px;font-weight:700;margin-top:5px;color:var(--text-body)}
.hex{font-size:11px;color:var(--text-muted);letter-spacing:.02em}
</style>
</head>
<body>

<div style="display:flex;flex-direction:column;gap:13px">
  <div class="eye" style="color:var(--text-eyebrow)">Question</div>
  <div class="eye" style="color:var(--yellow-ink)">Hint used · Rubric</div>
  <div class="eye" style="font:var(--eyebrow-sm);letter-spacing:var(--eyebrow-tracking);color:var(--purple-600)">Deep dive ▸</div>
  <div style="font:var(--meta);color:var(--text-muted)">Unit 2 · Exploring Two-Variable Data <span style="color:var(--rule-500)">/</span> <b style="color:var(--red-500)">2.3 · Least-Squares Regression</b></div>
  <div style="font:var(--micro);color:var(--text-eyebrow)">3 of 4 answers read</div>
  <div class="eye" style="font:var(--footer-caption);letter-spacing:var(--footer-caption-tracking);color:var(--ink-300)">Select one answer · pull a hint only if you need one</div>
</div>
</body>
</html>

<!-- @dsCard group="Type" viewport="700x220" subtitle="Bungee is the wordmark only; Passion One sets titles and scores at display sizes" name="Wordmark & headings" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Passion+One:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--paper-000);font-family:var(--font-ui);color:var(--text-body);padding:18px 20px}
.eye{font:var(--eyebrow);letter-spacing:var(--eyebrow-tracking);text-transform:uppercase}
.head{font-family:var(--font-head)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:104px}
.chip{height:56px;border:1px solid var(--rule-300)}
.lbl{font-size:12px;font-weight:700;margin-top:5px;color:var(--text-body)}
.hex{font-size:11px;color:var(--text-muted);letter-spacing:.02em}
</style>
</head>
<body>

<div style="display:flex;flex-direction:column;gap:14px">
  <div style="background:var(--red-500);padding:12px 16px;display:flex;align-items:baseline;gap:14px">
    <span style="font:var(--display-wordmark);letter-spacing:var(--display-wordmark-tracking);color:var(--paper-000);text-shadow:var(--shadow-wordmark)">CramApple</span>
    <span class="head" style="font-size:26px;line-height:1;color:rgba(255,255,255,.92)">Open Hand MCQ</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:22px">
    <span class="head" style="font-size:30px;line-height:1">Answer Key</span>
    <span class="head" style="font-size:27px;line-height:1.05">Reference Materials</span>
    <span class="head" style="font-size:26px;line-height:1;color:var(--blue-600)">1 / 1</span>
    <span class="head" style="font-size:22px;line-height:1;color:var(--purple-600)">A</span>
  </div>
</div>
</body>
</html>

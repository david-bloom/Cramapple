name: Minimal CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: minimal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.8.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run deterministic Deno tests
        run: >-
          deno test
          --allow-env=SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,ALLOWED_ORIGINS,POSTHOG_PROJECT_API_KEY,POSTHOG_PROJECT_TOKEN,POSTHOG_API_KEY,POSTHOG_HOST,CAPTURE_QUALITY_MODEL,CAPTURE_QUALITY_RESERVED_COST_USD,CAPTURE_QUALITY_TIMEOUT_MS,DENO_DEPLOYMENT_ID,EVALUATE_ATTEMPT_PROMPT_VERSION,FRQ_PHOTO_DAILY_CAP_USD,FRQ_PHOTO_RESPONSES_ENABLED,FRQ_PHOTO_SUBJECTS,FRQ_TRANSCRIPT_DAILY_RUNS,FRQ_TRANSCRIPT_MODEL,FRQ_TRANSCRIPT_RESERVED_COST_USD,FRQ_TRANSCRIPT_TIMEOUT_MS,GRADING_ARM,GRADING_ENTITLEMENTS_ENABLED,OPENAI_API_KEY,OPENAI_DAILY_CAP_USD,OPENAI_INPUT_PRICE_PER_1M,OPENAI_MAX_OUTPUT_TOKENS,OPENAI_MODEL,OPENAI_OUTPUT_PRICE_PER_1M,OPENAI_REQUEST_TIMEOUT_MS,SB_EXECUTION_ID,SERVICE_ROLE_KEY
          supabase/functions/_shared/request-metadata_test.ts
          supabase/functions/_shared/response-envelope_test.ts
          supabase/functions/_shared/input_test.ts
          supabase/functions/_shared/encoding_test.ts
          supabase/functions/_shared/grading-router_test.ts
          supabase/functions/_shared/formula-notation_test.ts
          supabase/functions/_shared/deterministic-verifier_test.ts
          supabase/functions/_shared/cell-state_test.ts
          supabase/functions/_shared/cell-state-signals_test.ts
          supabase/functions/_shared/grading-feedback_test.ts
          supabase/functions/_shared/grading-partial-credit_test.ts
          supabase/functions/_shared/grading-control-chars_test.ts
          supabase/functions/attempt-response/index_test.ts
          supabase/functions/evaluate-attempt/index_test.ts
          supabase/functions/capture-pairing/index_test.ts
          supabase/functions/session-event/index_test.ts
          supabase/functions/storage-sign-url/index_test.ts
          supabase/functions/start-trial/index_test.ts
          supabase/functions/_shared/addon-checkout_test.ts
          supabase/functions/_shared/checkout-access_test.ts
          supabase/functions/_shared/checkout-routing_test.ts
          supabase/functions/_shared/trial-promo_test.ts
          supabase/functions/_shared/trial-core_test.ts
          supabase/functions/_shared/trial-learner_test.ts
          supabase/functions/_shared/trial-checkout_test.ts
          supabase/functions/stripe-webhook/trial_test.ts
          supabase/functions/_shared/trial-notices_test.ts
          supabase/functions/_shared/trial-actions_test.ts
          supabase/functions/charge-due-trials/handler_test.ts
          supabase/functions/_shared/parent-short-link_test.ts
          supabase/functions/_shared/public-rate-limit_test.ts

      - name: Run AP Statistics checker tests
        run: python -m unittest scripts/ap_statistics_calculation_check/test_checker.py

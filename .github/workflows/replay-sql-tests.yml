name: Replay SQL regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  replay-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: task0078_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Exercise real SQL and concurrent replay claims on fixture database
        env:
          PGPASSWORD: fixture-only
        run: python scripts/task0078/run_replay_sql_tests.py

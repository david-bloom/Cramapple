name: Subject access SQL
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261031143302_subject_access_before_study.sql'
      - 'supabase/tests/subject_access.local.sql'
      - '.github/workflows/subject-access-sql-tests.yml'
permissions:
  contents: read
jobs:
  subject-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify migration and access boundaries in isolated Postgres
        env:
          PGPASSWORD: local-fixture-only
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/subject_access.local.sql

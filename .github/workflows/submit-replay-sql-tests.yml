name: Submission replay SQL regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: task0078_submit_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Execute real SQL in disposable fixture database
        env:
          PGPASSWORD: fixture-only
        run: psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d task0078_submit_fixture -f scripts/task0078/submit_response_sql_test.sql


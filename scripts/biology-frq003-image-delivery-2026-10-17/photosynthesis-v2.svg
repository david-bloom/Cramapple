<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1120" viewBox="0 0 360 1120" role="img" aria-labelledby="title desc"><title id="title">Light-dependent photosynthesis</title><desc id="desc">The thylakoid membrane is a vertical band, with lumen on the left and stroma on the right. Light reaches photosystem II and photosystem I. Electron arrows connect photosystem II to the electron transport chain, then to photosystem I and onward to NADP plus on the stroma side, where NADPH is formed. A proton arrow at the electron transport chain runs from stroma to lumen. A proton arrow through ATP synthase runs from lumen to stroma. ADP plus inorganic phosphate and ATP are shown on the stroma side. The diagram is schematic and does not specify molecule counts.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="360" height="1120" fill="white"/><g font-family="Arial, sans-serif" font-size="26" fill="#151515"><text x="170" y="30" text-anchor="middle">Light-dependent</text><text x="170" y="61" text-anchor="middle">reactions</text><text x="8" y="110" >Lumen</text><text x="250" y="110" >Stroma</text><rect x="92" y="132" width="156" height="968" fill="#e9f2ec" stroke="#35563d" stroke-width="2"/><text x="170" y="164" text-anchor="middle">Membrane</text><rect x="92" y="190" width="156" height="110" fill="#fff" stroke="#151515" stroke-width="2"/><text x="170" y="233" text-anchor="middle">Photosystem</text><text x="170" y="270" text-anchor="middle">II</text><rect x="92" y="380" width="156" height="145" fill="#fff" stroke="#151515" stroke-width="2"/><text x="170" y="419" text-anchor="middle">Electron</text><text x="170" y="453" text-anchor="middle">transport</text><text x="170" y="487" text-anchor="middle">chain</text><rect x="92" y="610" width="156" height="110" fill="#fff" stroke="#151515" stroke-width="2"/><text x="170" y="653" text-anchor="middle">Photosystem</text><text x="170" y="690" text-anchor="middle">I</text><rect x="92" y="850" width="156" height="110" fill="#fff" stroke="#151515" stroke-width="2"/><text x="170" y="883" text-anchor="middle">ATP</text><text x="170" y="939" text-anchor="middle">synthase</text><text x="8" y="166" >Light</text><path id="light-psii" d="M25 178 L88 217" fill="none" stroke="#151515" stroke-width="3" marker-end="url(#arrow)" /><text x="8" y="576" >Light</text><path id="light-psi" d="M25 588 L88 637" fill="none" stroke="#151515" stroke-width="3" marker-end="url(#arrow)" /><path id="electron-psii-etc" d="M170 302 V374" fill="none" stroke="#151515" stroke-width="3" marker-end="url(#arrow)" /><text x="183" y="348" >e⁻</text><path id="electron-etc-psi" d="M170 527 V604" fill="none" stroke="#151515" stroke-width="3" marker-end="url(#arrow)" /><text x="183" y="576" >e⁻</text><path id="proton-pump" d="M320 506 H20" fill="none" stroke="#225b82" stroke-width="3" marker-end="url(#arrow)" data-from="stroma" data-to="lumen"/><text x="272" y="490" >H⁺</text><text x="20" y="490" >H⁺</text><path id="electron-psi-nadp" d="M250 665 H294 V698" fill="none" stroke="#151515" stroke-width="3" marker-end="url(#arrow)" /><text x="261" y="645" >e⁻</text><text x="255" y="730" id="nadp">NADP⁺</text><text x="261" y="770" >+ H⁺</text><text x="283" y="810" >↓</text><text x="255" y="850" id="nadph">NADPH</text><path id="proton-atp" d="M20 905 H320" fill="none" stroke="#225b82" stroke-width="3" marker-end="url(#arrow)" data-from="lumen" data-to="stroma"/><text x="20" y="889" >H⁺</text><text x="273" y="889" >H⁺</text><text x="260" y="988" >ADP</text><text x="261" y="1019" >+ Pi</text><text x="284" y="1049" >↓</text><text x="266" y="1080" id="atp-product">ATP</text></g></svg>

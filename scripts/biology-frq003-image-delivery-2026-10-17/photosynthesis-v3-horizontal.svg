<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Light-dependent photosynthesis</title><desc id="desc">The thylakoid membrane is a horizontal band, with lumen above and stroma below. PSII means photosystem II, ETC means electron transport chain, and PSI means photosystem I. Light reaches PSII and PSI. Black electron arrows connect PSII to ETC, then to PSI and onward to NADP plus on the stroma side, where NADPH is formed. A blue proton arrow at ETC runs upward from stroma to lumen. A blue proton arrow through ATP synthase runs downward from lumen to stroma. NADP plus with H plus yields NADPH; ADP plus inorganic phosphate yields ATP, both on the stroma side. The diagram is schematic and does not specify molecule counts.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><rect width="1200" height="900" fill="white"/><g font-family="Arial, sans-serif" font-size="84" fill="#151515"><rect x="10" y="250" width="1180" height="250" fill="#e9f2ec" stroke="#35563d" stroke-width="4"/><rect x="20" y="250" width="200" height="250" rx="18" fill="white" stroke="#151515" stroke-width="4"/><rect x="280" y="250" width="230" height="250" rx="18" fill="white" stroke="#151515" stroke-width="4"/><rect x="570" y="250" width="190" height="250" rx="18" fill="white" stroke="#151515" stroke-width="4"/><rect x="795" y="250" width="395" height="250" rx="18" fill="white" stroke="#151515" stroke-width="4"/><text x="30" y="110" >Light</text><path id="light-psii" d="M120 140 V240" fill="none" stroke="#151515" stroke-width="6" marker-end="url(#arrow)" /><text x="590" y="110" >Light</text><path id="light-psi" d="M665 140 V240" fill="none" stroke="#151515" stroke-width="6" marker-end="url(#arrow)" /><text x="1030" y="100" text-anchor="middle" >Lumen</text><text x="25" y="800" >Stroma</text><text x="120" y="400" text-anchor="middle" >PSII</text><text x="375" y="400" text-anchor="middle" >ETC</text><text x="665" y="400" text-anchor="middle" >PSI</text><text x="980" y="345" text-anchor="middle" >ATP</text><text x="980" y="445" text-anchor="middle" >synthase</text><path id="electron-psii-etc" d="M230 400 H270" fill="none" stroke="#151515" stroke-width="6" marker-end="url(#arrow)" /><path id="electron-etc-psi" d="M520 400 H560" fill="none" stroke="#151515" stroke-width="6" marker-end="url(#arrow)" /><path id="electron-psi-nadp" d="M665 510 V552 H620 V594" fill="none" stroke="#151515" stroke-width="6" marker-end="url(#arrow)" /><path id="proton-pump" d="M490 590 V190" fill="none" stroke="#225b82" stroke-width="6" marker-end="url(#arrow)" data-from="stroma" data-to="lumen"/><text x="490" y="160" text-anchor="middle" >H⁺</text><text x="402" y="590" text-anchor="middle" >H⁺</text><path id="proton-atp" d="M1170 200 V570" fill="none" stroke="#225b82" stroke-width="6" marker-end="url(#arrow)" data-from="lumen" data-to="stroma"/><text x="1090" y="220" text-anchor="middle" >H⁺</text><text x="1090" y="580" text-anchor="middle" >H⁺</text><text x="510" y="690" text-anchor="middle" id="nadp">NADP⁺ + H⁺</text><path id="nadph-formation" d="M510 725 V775" fill="none" stroke="#151515" stroke-width="6" marker-end="url(#arrow)" /><text x="510" y="875" text-anchor="middle" id="nadph">NADPH</text><text x="1000" y="690" text-anchor="middle" >ADP + Pi</text><path id="atp-formation" d="M1000 725 V775" fill="none" stroke="#151515" stroke-width="6" marker-end="url(#arrow)" /><text x="1000" y="875" text-anchor="middle" id="atp-product">ATP</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="bio-chloroplast-t bio-chloroplast-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="bio-chloroplast-t">Chloroplast: regions and where the reactions happen</title>
<desc id="bio-chloroplast-d">A schematic chloroplast: a rounded double boundary, an outer and an inner membrane, enclosing a space. Inside that space sit four stacks of flattened discs. Each disc is a thylakoid and its membrane holds the chlorophyll, organised into two photosystems, along with the electron transport proteins; a stack of them is a granum, and the light reactions happen there. The fluid filling the rest of the space inside the inner membrane is the stroma, and that is where carbon fixation, the Calvin cycle, takes place. The two sets of reactions are therefore in different places: one in a membrane, one in the fluid around it, which is what this diagram is read for. Illustrative data.</desc>

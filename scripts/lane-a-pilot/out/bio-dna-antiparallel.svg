<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">ANTIPARALLEL STRANDS</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">Each base pairs with one partner, and the two strands run opposite ways</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">A pairs only with T, C only with G; the two strands run in opposite directions.</text>

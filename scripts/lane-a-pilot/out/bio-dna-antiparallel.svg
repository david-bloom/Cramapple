<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="bio-dna-antiparallel-t bio-dna-antiparallel-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="bio-dna-antiparallel-t">DNA: two strands, paired and antiparallel</title>
<desc id="bio-dna-antiparallel-d">A short stretch of DNA drawn flat, as a ladder rather than as a helix. The two sides of the ladder are the sugar-phosphate backbones, two strands of nucleotides, and each carries an arrowhead showing its direction from the 5' end to the 3' end. The arrowheads point opposite ways: the top strand's 3' end is on the right and the bottom strand's 3' end is on the left, which is what antiparallel means. The rungs are the base pairs. Each base on one strand is joined to exactly one base on the other: adenine always with thymine, cytosine always with guanine. The joins are hydrogen bonds, drawn as dashes, and there are two of them in every A with T pair and three in every C with G pair, so the C with G pairs are held together more strongly. Illustrative data.</desc>

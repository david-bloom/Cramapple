<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="bio-fluid-mosaic-t bio-fluid-mosaic-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="bio-fluid-mosaic-t">The plasma membrane: a bilayer with things embedded in it</title>
<desc id="bio-fluid-mosaic-d">A cross-section of a plasma membrane. Two rows of small circles are the phosphate heads of the phospholipids; the upper row faces the extracellular fluid and the lower row faces the cytoplasm, because both are watery and the heads are hydrophilic. From each head two lines run inward: these are the hydrophobic fatty acid tails, and the tails of the two rows meet in the middle, away from the water. Embedded in this framework are several other things. Two proteins cross the whole bilayer, so their hydrophobic regions are in contact with the fatty acids while their ends reach the water on each side. A small block sitting among the tails and reaching neither surface is a steroid, cholesterol in vertebrate animals. One of the crossing proteins and one single lipid head carry branched chains of sugars drawn above the membrane, making them a glycoprotein and a glycolipid; both carbohydrate chains are on the extracellular face, never the cytoplasmic one. All of these components move within the plane of the membrane, which is what the word fluid in fluid mosaic refers to. Illustrative data.</desc>

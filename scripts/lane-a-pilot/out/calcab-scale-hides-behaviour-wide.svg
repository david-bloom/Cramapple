<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="calcab-scale-hides-behaviour-wide-t calcab-scale-hides-behaviour-wide-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="calcab-scale-hides-behaviour-wide-t">The same function, seen at the usual scale</title>
<desc id="calcab-scale-hides-behaviour-wide-d">The graph of x cubed minus one hundredth of x, drawn over the interval from minus two to two with the vertical axis running from about minus eight to eight. At this scale it looks exactly like a plain cubic rising steadily through the origin, with no flat part and no turning points. The behaviour near the origin is far too small to see: the whole feature is about eight ten-thousandths tall, which at this scale is thinner than the drawn line. A shape read off this picture alone would be wrong, and that is the point: a graph is evidence about a function rather than proof, so an estimate taken from one should be treated with care.</desc>

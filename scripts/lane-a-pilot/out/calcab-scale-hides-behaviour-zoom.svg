<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="calcab-scale-hides-behaviour-zoom-t calcab-scale-hides-behaviour-zoom-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="calcab-scale-hides-behaviour-zoom-t">The same function, zoomed in near the origin</title>
<desc id="calcab-scale-hides-behaviour-zoom-d">The graph of the same function, x cubed minus one hundredth of x, over a window about thirteen times narrower horizontally and ten thousand times finer vertically. Now a local maximum and a local minimum are plainly visible, at about x equals minus zero point zero five eight and plus zero point zero five eight, with the function decreasing between them. This is the behaviour the wide view could not show. Both pictures are of the same function and both are accurate; only the scale differs, which is why a graph-based estimate of a limit or of a shape should be treated with care rather than trusted.</desc>

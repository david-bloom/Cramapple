<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">ANODE, CATHODE, BRIDGE</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">Oxidation at the anode; electrons through the wire; ions through the bridge</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">Electrons go anode to cathode through the wire; ions go through the bridge.</text>

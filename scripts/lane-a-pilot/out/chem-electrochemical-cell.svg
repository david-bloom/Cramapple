<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="chem-electrochemical-cell-t chem-electrochemical-cell-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="chem-electrochemical-cell-t">Reading a galvanic cell diagram</title>
<desc id="chem-electrochemical-cell-d">A galvanic cell. Two beakers each hold a half-cell solution containing the active species of one half-reaction, and an electrode dips into each solution. The left electrode is the anode, where oxidation occurs; the right electrode is the cathode, where reduction occurs. Which electrode changes mass, or evolves a gas, depends on the half-reactions, and this diagram names neither. A wire runs from the top of one electrode to the top of the other, and a meter sits in that external circuit to read the cell potential. Electrons travel through that wire in one direction only, from the anode to the cathode, shown by an arrow above the wire. An inverted U shaped salt bridge joins the two solutions: both of its ends are below the liquid surface, and it touches neither electrode. Ions move through it, cations toward the cathode and anions toward the anode, which keeps each half-cell electrically neutral and lets the current keep flowing. Illustrative data.</desc>

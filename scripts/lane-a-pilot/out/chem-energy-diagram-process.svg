<text transform="translate(92.25,298.0) rotate(-90)" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">ENERGY</text>
<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">ENERGY DIAGRAM FOR A PROCESS</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">Products below reactants means energy is released: the process is exothermic</text>

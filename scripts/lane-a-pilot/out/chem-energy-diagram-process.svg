<line x1="511.0" y1="173.6" x2="521.0" y2="173.6" stroke="#6E6E6E" stroke-width="1.1"/>
<line x1="511.0" y1="422.4" x2="521.0" y2="422.4" stroke="#6E6E6E" stroke-width="1.1"/>

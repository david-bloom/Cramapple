<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="ttl desc" font-family="Helvetica Neue, Arial, sans-serif">
<title id="ttl">Energy diagram for a process</title>
<desc id="desc">Two energy levels joined by a falling curve. The final state sits below the initial state, so energy is released and the process is exothermic. Illustrative data.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="ttl desc" font-family="Helvetica Neue, Arial, sans-serif">
<title id="ttl">Multistep reaction energy profile</title>
<desc id="desc">Energy along the reaction coordinate for a two-step mechanism. The curve rises to a first transition state, falls to an intermediate, rises to a lower second transition state, then falls to products below the reactant level, so the overall reaction is exothermic. The first barrier is the larger of the two and sets the rate. Illustrative data.</desc>

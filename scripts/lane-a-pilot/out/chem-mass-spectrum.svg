<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="ttl desc" font-family="Helvetica Neue, Arial, sans-serif">
<title id="ttl">Mass spectrum of a single element</title>
<desc id="desc">Three vertical peaks at masses 24, 25 and 26. The peak at mass 24 is by far the tallest at about 79 percent, with smaller peaks near 10 and 11 percent. Peak position identifies the isotope and peak height gives its natural abundance.</desc>
<rect width="980" height="620" fill="#FAFAF8"/>
<line x1="112" y1="411.5" x2="920" y2="411.5" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="331.0" x2="920" y2="331.0" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="250.4" x2="920" y2="250.4" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="169.9" x2="920" y2="169.9" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="347.7" y1="492.0" x2="347.7" y2="174.0" stroke="#151515" stroke-width="7.0" stroke-linecap="butt"/>
<text x="347.7" y="164.0" text-anchor="middle" font-size="11.5" fill="#151515">24Mg  78.99%</text>
<line x1="516.0" y1="492.0" x2="516.0" y2="451.7" stroke="#151515" stroke-width="7.0" stroke-linecap="butt"/>
<text x="516.0" y="441.7" text-anchor="middle" font-size="11.5" fill="#151515">25Mg  10.00%</text>
<line x1="684.3" y1="492.0" x2="684.3" y2="447.7" stroke="#151515" stroke-width="7.0" stroke-linecap="butt"/>
<text x="684.3" y="437.7" text-anchor="middle" font-size="11.5" fill="#151515">26Mg  11.01%</text>
<line x1="112" y1="104.0" x2="112" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<line x1="112" y1="492.0" x2="920" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<text x="516.0" y="546.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">MASS (AMU)</text>
<text transform="translate(80.7,298.0) rotate(-90)" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">RELATIVE ABUNDANCE (%)</text>
<line x1="107" y1="492.0" x2="112" y2="492.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="496.0" text-anchor="end" font-size="10.5" fill="#6E6E6E">0</text>
<line x1="107" y1="411.5" x2="112" y2="411.5" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="415.5" text-anchor="end" font-size="10.5" fill="#6E6E6E">20</text>
<line x1="107" y1="331.0" x2="112" y2="331.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="335.0" text-anchor="end" font-size="10.5" fill="#6E6E6E">40</text>
<line x1="107" y1="250.4" x2="112" y2="250.4" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="254.4" text-anchor="end" font-size="10.5" fill="#6E6E6E">60</text>
<line x1="107" y1="169.9" x2="112" y2="169.9" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="173.9" text-anchor="end" font-size="10.5" fill="#6E6E6E">80</text>
<line x1="179.3" y1="492.0" x2="179.3" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="179.3" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">23</text>
<line x1="347.7" y1="492.0" x2="347.7" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="347.7" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">24</text>
<line x1="516.0" y1="492.0" x2="516.0" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="516.0" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">25</text>
<line x1="684.3" y1="492.0" x2="684.3" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="684.3" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">26</text>

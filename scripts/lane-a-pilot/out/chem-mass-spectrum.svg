<text x="852.7" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">27</text>
<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">MASS SPECTRUM (MAGNESIUM)</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">Magnesium: one peak per isotope, height set by natural abundance</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">FROM DATA</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">Isotopes differ in neutron count, not proton or electron count.</text>
</svg>
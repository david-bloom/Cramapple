<title id="ttl">Maxwell–Boltzmann distribution: effect of a catalyst</title>
<desc id="desc">One distribution curve of number of particles against kinetic energy at a fixed temperature, with two vertical activation-energy markers. The catalysed barrier sits to the left of the uncatalysed one, so the shaded area beyond it is larger. Illustrative data.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="ttl desc" font-family="Helvetica Neue, Arial, sans-serif">
<title id="ttl">A balanced equation as particles</title>
<desc id="desc">Two boxes with an arrow from the first to the second. The first box holds two hydrogen molecules, each a pair of small pale circles joined by a bond, and one oxygen molecule, a pair of larger dark circles joined by a bond. The second box holds two water molecules, each one large dark oxygen atom with two small pale hydrogen atoms bonded to it. Count the atoms and they match: four hydrogen and two oxygen on each side. Nothing appears in the second box that was not in the first; the same atoms have been rearranged into different molecules. Illustrative data.</desc>
<rect width="980" height="620" fill="#FAFAF8"/>
<rect x="112.0" y="104.0" width="353.5" height="348.9" fill="#FAFAF8" stroke="#D8D8D3" stroke-width="1.2"/>
<circle cx="186.5" cy="210.5" r="14.0" fill="#E6E6E2" stroke="#151515" stroke-width="1"/>
<line x1="186.5" y1="210.5" x2="232.4" y2="210.5" stroke="#151515" stroke-width="4.2"/>
<circle cx="232.4" cy="210.5" r="14.0" fill="#E6E6E2" stroke="#151515" stroke-width="1"/>
<circle cx="369.9" cy="210.5" r="14.0" fill="#E6E6E2" stroke="#151515" stroke-width="1"/>
<line x1="369.9" y1="210.5" x2="415.9" y2="210.5" stroke="#151515" stroke-width="4.2"/>
<circle cx="415.9" cy="210.5" r="14.0" fill="#E6E6E2" stroke="#151515" stroke-width="1"/>
<circle cx="196.3" cy="384.9" r="21.6" fill="#151515" stroke="#151515" stroke-width="1"/>
<line x1="196.3" y1="384.9" x2="249.3" y2="384.9" stroke="#151515" stroke-width="4.2"/>
<circle cx="249.3" cy="384.9" r="21.6" fill="#151515" stroke="#151515" stroke-width="1"/>
<text x="288.8" y="467.8" text-anchor="middle" font-size="11.5" fill="#151515">before</text>
<text x="288.8" y="482.8" text-anchor="middle" font-size="10.6" fill="#6E6E6E">2 H₂ + O₂</text>
<rect x="566.5" y="104.0" width="353.5" height="348.9" fill="#FAFAF8" stroke="#D8D8D3" stroke-width="1.2"/>
<circle cx="674.8" cy="226.0" r="21.6" fill="#151515" stroke="#151515" stroke-width="1"/>
<line x1="674.8" y1="226.0" x2="644.8" y2="248.7" stroke="#151515" stroke-width="4.2"/>
<circle cx="644.8" cy="248.7" r="14.0" fill="#E6E6E2" stroke="#151515" stroke-width="1"/>
<line x1="674.8" y1="226.0" x2="704.9" y2="248.7" stroke="#151515" stroke-width="4.2"/>
<circle cx="704.9" cy="248.7" r="14.0" fill="#E6E6E2" stroke="#151515" stroke-width="1"/>
<circle cx="858.2" cy="226.0" r="21.6" fill="#151515" stroke="#151515" stroke-width="1"/>
<line x1="858.2" y1="226.0" x2="828.2" y2="248.7" stroke="#151515" stroke-width="4.2"/>
<circle cx="828.2" cy="248.7" r="14.0" fill="#E6E6E2" stroke="#151515" stroke-width="1"/>
<line x1="858.2" y1="226.0" x2="888.2" y2="248.7" stroke="#151515" stroke-width="4.2"/>
<circle cx="888.2" cy="248.7" r="14.0" fill="#E6E6E2" stroke="#151515" stroke-width="1"/>
<text x="743.2" y="467.8" text-anchor="middle" font-size="11.5" fill="#151515">after</text>
<text x="743.2" y="482.8" text-anchor="middle" font-size="10.6" fill="#6E6E6E">2 H₂O</text>
<line x1="475.7" y1="278.4" x2="505.1" y2="278.4" stroke="#151515" stroke-width="2.6"/>
<path d="M 511.9,278.4 L 499.4,272.7 L 499.4,284.2 Z" fill="#151515"/>
<text x="112.0" y="506.7" font-size="10.5" fill="#6E6E6E">small pale circles are hydrogen atoms; large dark circles are oxygen</text>
<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">ATOMS ARE CONSERVED</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">2 H₂ + O₂ → 2 H₂O: the atoms before and after are the same atoms</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">4 H and 2 O before; 4 H and 2 O after.</text>
</svg>
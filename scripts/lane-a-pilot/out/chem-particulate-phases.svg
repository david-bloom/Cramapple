<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="ttl desc" font-family="Helvetica Neue, Arial, sans-serif">
<title id="ttl">Particulate model of the three phases</title>
<desc id="desc">Three boxes of the same size, each holding identical round particles. In the solid the sixteen particles sit in a regular grid, touching, in rows and columns. In the liquid the same sixteen are still in close contact but their arrangement is irregular, with no repeating pattern. In the gas only five particles are shown in the same box, spread far apart with large empty gaps between them. Solid and liquid take comparable space for the same amount of matter; the gas is mostly empty space. Illustrative data.</desc>

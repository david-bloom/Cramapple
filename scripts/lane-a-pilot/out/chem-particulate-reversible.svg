<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="chem-particulate-reversible-t chem-particulate-reversible-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="chem-particulate-reversible-t">A reversible reaction before and at equilibrium</title>
<desc id="chem-particulate-reversible-d">Two boxes with an arrow from the first to the second. The first box holds sixteen pale particles of form A and no B. The second box, at equilibrium, holds four pale A particles and twelve dark B particles, sixteen in all. A and B are two forms of the same molecule, an isomerisation, so each particle that reacts simply becomes one particle of the other form and no matter is created or destroyed. The reactant has not run out: some A is still present, which is what distinguishes equilibrium from a reaction that goes to completion. The equilibrium constant is read straight off the counts as twelve divided by four, which is three. Illustrative data.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="ttl desc" font-family="Helvetica Neue, Arial, sans-serif">
<title id="ttl">A solution drawn as particles</title>
<desc id="desc">Two boxes of the same size, each holding twenty-four particles in close contact. Pale circles are solvent and dark circles are solute. The left box has one dark solute particle among twenty-three pale solvent particles; the right box has six dark among eighteen pale. Both boxes are equally full, so what differs between them is the proportion of solute, not how much liquid there is. The solute particles are surrounded by solvent particles rather than clumped together, which is what being dissolved means. Illustrative data.</desc>

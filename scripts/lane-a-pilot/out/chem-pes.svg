<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="chem-pes-t chem-pes-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="chem-pes-t">Photoelectron spectrum</title>
<desc id="chem-pes-d">Three peaks on a logarithmic binding-energy axis that decreases to the right, for nitrogen (1s2 2s2 2p3). The 1s peak sits far left at about 39.6 megajoules per mole with height two, then 2s at about 2.45 with height two, then 2p at about 1.45 with height three. Peak height is proportional to the number of electrons in that subshell, and the three heights sum to nitrogen's seven electrons. Illustrative values.</desc>
<rect width="980" height="620" fill="#FAFAF8"/>
<line x1="112" y1="386.0" x2="920" y2="386.0" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="280.0" x2="920" y2="280.0" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="174.0" x2="920" y2="174.0" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="191.9" y1="492.0" x2="191.9" y2="280.0" stroke="#151515" stroke-width="7.0" stroke-linecap="butt"/>
<text x="191.9" y="270.0" text-anchor="middle" font-size="11.5" fill="#151515">1s</text>
<line x1="727.3" y1="492.0" x2="727.3" y2="280.0" stroke="#151515" stroke-width="7.0" stroke-linecap="butt"/>
<text x="727.3" y="270.0" text-anchor="middle" font-size="11.5" fill="#151515">2s</text>
<line x1="828.2" y1="492.0" x2="828.2" y2="174.0" stroke="#151515" stroke-width="7.0" stroke-linecap="butt"/>
<text x="828.2" y="164.0" text-anchor="middle" font-size="11.5" fill="#151515">2p</text>
<line x1="112" y1="104.0" x2="112" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<line x1="112" y1="492.0" x2="920" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<text x="516.0" y="546.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">BINDING ENERGY (MJ/MOL), DECREASING TO THE RIGHT</text>
<text transform="translate(86.5,298.0) rotate(-90)" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">RELATIVE NUMBER OF ELECTRONS</text>
<line x1="107" y1="492.0" x2="112" y2="492.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="496.0" text-anchor="end" font-size="10.5" fill="#6E6E6E">0</text>
<line x1="107" y1="386.0" x2="112" y2="386.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="390.0" text-anchor="end" font-size="10.5" fill="#6E6E6E">1</text>
<line x1="107" y1="280.0" x2="112" y2="280.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="284.0" text-anchor="end" font-size="10.5" fill="#6E6E6E">2</text>
<line x1="107" y1="174.0" x2="112" y2="174.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="178.0" text-anchor="end" font-size="10.5" fill="#6E6E6E">3</text>
<line x1="899.7" y1="492.0" x2="899.7" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="899.7" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">1</text>
<line x1="766.4" y1="492.0" x2="766.4" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="766.4" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">2</text>
<line x1="590.1" y1="492.0" x2="590.1" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="590.1" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">5</text>
<line x1="456.7" y1="492.0" x2="456.7" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="456.7" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">10</text>
<line x1="323.4" y1="492.0" x2="323.4" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="323.4" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">20</text>
<line x1="147.1" y1="492.0" x2="147.1" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="147.1" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">50</text>
<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">PHOTOELECTRON SPECTRUM (NITROGEN)</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">Nitrogen (1s2 2s2 2p3): one peak per subshell, height set by electron count</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">Electrons closer to the nucleus need more energy to remove.</text>
</svg>
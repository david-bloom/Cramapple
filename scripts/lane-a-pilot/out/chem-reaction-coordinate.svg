<title id="chem-reaction-coordinate-t">The reaction coordinate</title>
<desc id="chem-reaction-coordinate-d">Energy plotted against the reaction coordinate. The curve starts at the reactant level on the left, rises to a maximum and then falls to a product level below the reactants on the right, so this example is exothermic. The horizontal axis is the reaction coordinate, the path of the motions that turn reactants into products. Illustrative data.</desc>

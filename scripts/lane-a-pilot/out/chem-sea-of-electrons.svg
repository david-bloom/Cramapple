<text x="112" y="70" font-size="12.5" fill="#6E6E6E">A regular array of positive ions, with the valence electrons belonging to none of them</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">The electrons are drawn between the ions, not attached to them.</text>

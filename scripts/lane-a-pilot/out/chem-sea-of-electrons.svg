<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="ttl desc" font-family="Helvetica Neue, Arial, sans-serif">
<title id="ttl">Sea-of-electrons model of a metal</title>
<desc id="desc">A box holding nine large pale circles in a regular three-by-three array, each marked with a plus sign to show it is a positive metal ion. Between and around them are many small dark dots standing for the valence electrons. The dots are not drawn on or beside any particular ion: they are spread across the whole box, because in a metal the valence electrons are delocalized and belong to the solid as a whole rather than to individual atoms. That is what lets a metal conduct and deform without breaking. Illustrative data.</desc>

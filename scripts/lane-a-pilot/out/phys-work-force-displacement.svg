<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="phys-work-force-displacement-t phys-work-force-displacement-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="phys-work-force-displacement-t">Work as the area under a force-displacement graph</title>
<desc id="phys-work-force-displacement-d">A graph of the component of a force along the direction of motion, against displacement. The force holds steady at 8 newtons from 0 to 2 metres, then falls in a straight line to zero at 6 metres. The whole region between that line and the horizontal axis is shaded, because the area under the graph is the work the force does: 16 joules from the flat part and 16 more from the triangle, 32 joules in total. Reading a value off the curve gives a force, not a work; only the area is the work. Illustrative data.</desc>

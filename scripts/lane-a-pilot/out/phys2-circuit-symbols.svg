<text x="819.0" y="453.2" text-anchor="middle" font-size="10.9" fill="#151515">Variable element</text>
<text x="112.0" y="506.7" font-size="10.5" fill="#6E6E6E">a diagonal arrow across any symbol marks a variable element</text>
<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">SCHEMATIC SYMBOLS</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">The standard symbols, and what a diagonal arrow across one means</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">The diagonal arrow is a notation, not a ninth component: it makes any symbol variable.</text>

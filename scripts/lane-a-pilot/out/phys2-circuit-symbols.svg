<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="ttl desc" font-family="Helvetica Neue, Arial, sans-serif">
<title id="ttl">Circuit schematic symbols</title>
<desc id="desc">A key of eight circuit schematic symbols, each drawn with its name beneath it. The battery is a long thin line beside a short thick one. The bulb is a circle with a cross inside it. The switch is a gap in the wire with a hinged arm lifted away from its contact. The capacitor is two equal parallel plates with a gap between them. The resistor is a zigzag. The ammeter is a circle marked A and the voltmeter a circle marked V. The last cell shows a resistor with a diagonal arrow struck through it: that arrow, over any standard symbol, is what makes the element variable, so it is a notation rather than a separate component. Illustrative data.</desc>

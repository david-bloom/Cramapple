<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="phys2-equipotential-map-t phys2-equipotential-map-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="phys2-equipotential-map-t">Equipotentials and field vectors around a point charge</title>
<desc id="phys2-equipotential-map-d">A map around a single positive point charge. Four dashed circles centred on the charge are isolines of electric potential: every point on one circle is at the same potential, and the potential falls as the circles get larger. Straight arrows placed between the circles are electric field vectors. Each arrow points directly away from the charge, so where it meets an isoline it crosses at a right angle, and it points towards lower potential. Because no arrow has any component along a circle, moving a charge around an isoline takes no work at all. The arrows are longer close to the charge, where the field is stronger. Illustrative data.</desc>

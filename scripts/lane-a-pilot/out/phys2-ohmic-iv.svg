<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="phys2-ohmic-iv-t phys2-ohmic-iv-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="phys2-ohmic-iv-t">Current against potential difference: ohmic and non-ohmic</title>
<desc id="phys2-ohmic-iv-d">A graph of current against potential difference for two circuit elements, both starting at the origin. The ohmic element gives a straight line: doubling the potential difference doubles the current, so the ratio is fixed and the resistance is constant at 25 ohms. The second element's line rises steeply at first and then flattens, so equal steps in potential difference add less and less current; its ratio of potential difference to current keeps climbing and no single resistance describes it. The resistance of the ohmic element is one divided by the slope, not the slope itself. Illustrative data.</desc>
<rect width="980" height="620" fill="#FAFAF8"/>
<line x1="112" y1="451.5" x2="920" y2="451.5" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="393.6" x2="920" y2="393.6" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="335.6" x2="920" y2="335.6" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="277.7" x2="920" y2="277.7" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="219.8" x2="920" y2="219.8" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="161.9" x2="920" y2="161.9" stroke="#D8D8D3" stroke-width="0.8"/>
<path d="M 159.5,451.5 L 329.3,393.6 L 499.0,335.6 L 668.8,277.7 L 838.5,219.8" fill="none" stroke="#151515" stroke-width="2.6" stroke-linecap="round"/>
<path d="M 159.5,451.5 L 227.4,375.8 L 295.3,336.8 L 397.2,291.1 L 499.0,252.8 L 600.9,218.9 L 702.7,188.1 L 770.6,168.8 L 838.5,150.3" fill="none" stroke="#6E6E6E" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="11 6"/>
<circle cx="838.5" cy="219.8" r="4" fill="#151515"/>
<text x="838.5" y="206.8" text-anchor="middle" font-size="11.5" fill="#151515">slope = 1/R</text>
<line x1="112" y1="104.0" x2="112" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<line x1="112" y1="492.0" x2="920" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<text x="516.0" y="546.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">POTENTIAL DIFFERENCE ΔV (V)</text>
<text transform="translate(69.2,298.0) rotate(-90)" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">CURRENT I (A)</text>
<line x1="107" y1="451.5" x2="112" y2="451.5" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="455.5" text-anchor="end" font-size="10.5" fill="#6E6E6E">0.00</text>
<line x1="107" y1="393.6" x2="112" y2="393.6" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="397.6" text-anchor="end" font-size="10.5" fill="#6E6E6E">0.05</text>
<line x1="107" y1="335.6" x2="112" y2="335.6" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="339.6" text-anchor="end" font-size="10.5" fill="#6E6E6E">0.10</text>
<line x1="107" y1="277.7" x2="112" y2="277.7" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="281.7" text-anchor="end" font-size="10.5" fill="#6E6E6E">0.15</text>
<line x1="107" y1="219.8" x2="112" y2="219.8" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="223.8" text-anchor="end" font-size="10.5" fill="#6E6E6E">0.20</text>
<line x1="107" y1="161.9" x2="112" y2="161.9" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="165.9" text-anchor="end" font-size="10.5" fill="#6E6E6E">0.25</text>
<line x1="159.5" y1="492.0" x2="159.5" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="159.5" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">0</text>
<line x1="431.1" y1="492.0" x2="431.1" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="431.1" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">2</text>
<line x1="702.7" y1="492.0" x2="702.7" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="702.7" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">4</text>
<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">OHMIC IS STRAIGHT</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">A straight line through the origin is what makes an element ohmic</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">Resistance is 1/slope here: the slope is 0.040 A/V, so R = 25 Ω.</text>
<line x1="112.0" y1="88.0" x2="138.0" y2="88.0" stroke="#151515" stroke-width="2.6"/>
<text x="148.0" y="92.0" font-size="11.5" fill="#151515">ohmic element</text>
<line x1="252.2" y1="88.0" x2="278.2" y2="88.0" stroke="#6E6E6E" stroke-width="2.6" stroke-dasharray="11 6"/>
<text x="288.2" y="92.0" font-size="11.5" fill="#151515">non-ohmic element</text>
</svg>
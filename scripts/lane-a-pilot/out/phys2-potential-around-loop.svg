<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="phys2-potential-around-loop-t phys2-potential-around-loop-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="phys2-potential-around-loop-t">Electric potential around a circuit loop</title>
<desc id="phys2-potential-around-loop-d">A graph of electric potential against position as you travel once around a single circuit loop. Starting at zero, the potential rises by 12 volts at the battery, where the tick is marked, stays flat along the connecting wire, drops by 8 volts across the first resistor, stays flat again, then drops by 4 volts across the second resistor, returning to zero. The trace ends at the same potential it started at, because the net change around a closed loop is zero. Illustrative data.</desc>
<rect width="980" height="620" fill="#FAFAF8"/>
<line x1="112" y1="436.6" x2="920" y2="436.6" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="347.9" x2="920" y2="347.9" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="259.2" x2="920" y2="259.2" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="170.5" x2="920" y2="170.5" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="436.6" x2="920" y2="436.6" stroke="#6E6E6E" stroke-width="1" stroke-dasharray="4 4"/>
<text x="916" y="428.6" text-anchor="end" font-size="11.5" fill="#6E6E6E">starting potential</text>
<path d="M 141.2,436.6 L 258.0,436.6 L 258.0,170.5 L 491.7,170.5 L 491.7,347.9 L 725.3,347.9 L 725.3,436.6 L 881.1,436.6" fill="none" stroke="#151515" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="258.0" cy="170.5" r="4" fill="#151515"/>
<text x="258.0" y="157.5" text-anchor="middle" font-size="11.5" fill="#151515">+12 V</text>
<circle cx="491.7" cy="347.9" r="4" fill="#151515"/>
<text x="501.7" y="351.9" font-size="11.5" fill="#151515">−8 V</text>
<circle cx="725.3" cy="436.6" r="4" fill="#151515"/>
<text x="725.3" y="456.6" text-anchor="middle" font-size="11.5" fill="#151515">−4 V</text>
<line x1="112" y1="104.0" x2="112" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<line x1="112" y1="492.0" x2="920" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<text x="516.0" y="546.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">POSITION AROUND THE LOOP</text>
<text transform="translate(80.7,298.0) rotate(-90)" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">ELECTRIC POTENTIAL (V)</text>
<line x1="107" y1="436.6" x2="112" y2="436.6" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="440.6" text-anchor="end" font-size="10.5" fill="#6E6E6E">0</text>
<line x1="107" y1="347.9" x2="112" y2="347.9" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="351.9" text-anchor="end" font-size="10.5" fill="#6E6E6E">4</text>
<line x1="107" y1="259.2" x2="112" y2="259.2" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="263.2" text-anchor="end" font-size="10.5" fill="#6E6E6E">8</text>
<line x1="107" y1="170.5" x2="112" y2="170.5" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="174.5" text-anchor="end" font-size="10.5" fill="#6E6E6E">12</text>
<line x1="258.0" y1="492.0" x2="258.0" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="258.0" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">battery</text>
<line x1="491.7" y1="492.0" x2="491.7" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="491.7" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">resistor 1</text>
<line x1="725.3" y1="492.0" x2="725.3" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="725.3" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">resistor 2</text>
<line x1="881.1" y1="492.0" x2="881.1" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="881.1" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">end</text>
<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">POTENTIAL AROUND A LOOP</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">Every rise and drop in one trip round; the net change is zero</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">The rises and the drops cancel exactly: +12 − 8 − 4 = 0, which is Kirchhoff's loop rule.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="phys2-pv-isotherm-work-t phys2-pv-isotherm-work-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="phys2-pv-isotherm-work-t">PV diagram: the isotherm and the work</title>
<desc id="phys2-pv-isotherm-work-d">A pressure-versus-volume diagram for a gas. A single curve falls from upper left to lower right along an isotherm, a line of constant temperature on which the product of pressure and volume is the same at every point. The region between the curve and the volume axis, between the starting and finishing volumes, is shaded: its area is the magnitude of the work for the process. The axes carry no numbers because the diagram teaches the shape, not a measurement. Illustrative data.</desc>

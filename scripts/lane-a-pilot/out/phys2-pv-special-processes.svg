<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="phys2-pv-special-processes-t phys2-pv-special-processes-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="phys2-pv-special-processes-t">PV diagram: the four special processes</title>
<desc id="phys2-pv-special-processes-d">A pressure-versus-volume diagram showing four processes leaving the same starting state. The isovolumetric process is a vertical line, because the volume does not change. The isobaric process is a horizontal line, because the pressure does not change. The isothermal process follows the isotherm, on which pressure times volume is constant. The adiabatic process starts at the same point but falls more steeply than the isotherm, because no energy is transferred thermally. Illustrative data.</desc>

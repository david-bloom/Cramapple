<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="ttl desc" font-family="Helvetica Neue, Arial, sans-serif">
<title id="ttl">Finding the zero-pressure temperature by extrapolation</title>
<desc id="desc">A graph of the pressure of a fixed sample of gas at constant volume against its temperature in degrees Celsius. Five measured points from 0 to 100 degrees lie on a rising straight line. That line is continued as a dashed extension far to the left, beyond any measurement, until it crosses zero pressure at about minus 273 degrees Celsius, which is the zero-pressure temperature. The point is reached by extending the line, not by measuring there: no gas stays a gas that cold. Illustrative data.</desc>
<rect width="980" height="620" fill="#FAFAF8"/>
<line x1="112" y1="459.3" x2="920" y2="459.3" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="342.4" x2="920" y2="342.4" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="225.5" x2="920" y2="225.5" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="108.7" x2="920" y2="108.7" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="459.3" x2="920" y2="459.3" stroke="#6E6E6E" stroke-width="1" stroke-dasharray="4 4"/>
<text x="916" y="451.3" text-anchor="end" font-size="11.5" fill="#6E6E6E">zero pressure</text>
<path d="M 162.5,459.3 L 675.7,225.5" fill="none" stroke="#6E6E6E" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="11 6"/>
<path d="M 675.7,225.5 L 722.7,204.1 L 769.7,182.8 L 816.7,161.4 L 863.6,140.0" fill="none" stroke="#151515" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="162.5" cy="459.3" r="4" fill="#151515"/>
<text x="162.5" y="446.3" text-anchor="middle" font-size="11.5" fill="#151515">P = 0 at −273 °C</text>
<line x1="112" y1="104.0" x2="112" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<line x1="112" y1="492.0" x2="920" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<text x="516.0" y="546.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">TEMPERATURE (°C)</text>
<text transform="translate(74.9,298.0) rotate(-90)" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">PRESSURE (KPA)</text>
<line x1="107" y1="459.3" x2="112" y2="459.3" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="463.3" text-anchor="end" font-size="10.5" fill="#6E6E6E">0</text>
<line x1="107" y1="342.4" x2="112" y2="342.4" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="346.4" text-anchor="end" font-size="10.5" fill="#6E6E6E">50</text>
<line x1="107" y1="225.5" x2="112" y2="225.5" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="229.5" text-anchor="end" font-size="10.5" fill="#6E6E6E">100</text>
<line x1="107" y1="108.7" x2="112" y2="108.7" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="112.7" text-anchor="end" font-size="10.5" fill="#6E6E6E">150</text>
<line x1="162.5" y1="492.0" x2="162.5" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="162.5" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">−273</text>
<line x1="393.9" y1="492.0" x2="393.9" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="393.9" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">−150</text>
<line x1="675.7" y1="492.0" x2="675.7" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="675.7" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">0</text>
<line x1="863.6" y1="492.0" x2="863.6" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="863.6" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">100</text>
<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">EXTRAPOLATE TO P = 0</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">The line is extended well past the measurements to reach zero pressure</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">No measurement is taken near −273 °C; the temperature is read off the extended line.</text>
<line x1="112.0" y1="88.0" x2="138.0" y2="88.0" stroke="#6E6E6E" stroke-width="2.6" stroke-dasharray="11 6"/>
<text x="148.0" y="92.0" font-size="11.5" fill="#151515">extended line</text>
<line x1="252.2" y1="88.0" x2="278.2" y2="88.0" stroke="#151515" stroke-width="2.6"/>
<text x="288.2" y="92.0" font-size="11.5" fill="#151515">measured</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="precalc-aroc-concavity-t precalc-aroc-concavity-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="precalc-aroc-concavity-t">Concavity read from average rates of change</title>
<desc id="precalc-aroc-concavity-d">A parabola with three dashed secant lines drawn over three touching intervals of equal width, from zero to one, one to two, and two to three. The secants get steeper from left to right: their slopes are one, three and five. Because the average rate of change over equal-width intervals is increasing, the graph is concave up. This is the definition of concavity that does not need calculus: compare average rates over equal intervals rather than looking at the bend by eye.</desc>

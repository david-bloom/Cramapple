<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="precalc-concavity-t precalc-concavity-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="precalc-concavity-t">Concave up and concave down</title>
<desc id="precalc-concavity-d">The graph of a cubic function over the interval from minus two to two. To the left of zero the curve is concave down: it bends downwards throughout, even though it rises at first, flattens, turns and falls. To the right of zero it is concave up: it bends upwards throughout, falling at first and then rising. The two halves are labelled. Concavity describes how the RATE OF CHANGE is changing, not whether the function itself is increasing or decreasing, which is why a curve can be rising and concave down at the same time, and falling and concave down as well.</desc>

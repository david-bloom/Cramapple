<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="precalc-cosecant-graph-t precalc-cosecant-graph-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="precalc-cosecant-graph-t">The cosecant graph</title>
<desc id="precalc-cosecant-graph-d">The cosecant graph, drawn as separate U-shaped branches between vertical dashed asymptotes. The asymptotes sit where the sine is zero, which is at zero and at every multiple of pi, because cosecant is one over sine. As with the secant, no part of the graph lies strictly between minus one and one. The difference between the two is only where the asymptotes fall: the secant's are where cosine vanishes, the cosecant's where sine does, which is a quarter period apart.</desc>

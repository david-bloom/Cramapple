<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="precalc-cotangent-graph-t precalc-cotangent-graph-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="precalc-cotangent-graph-t">The cotangent graph</title>
<desc id="precalc-cotangent-graph-d">The cotangent graph, drawn as separate branches between vertical dashed asymptotes. Each branch starts high on the left of its interval and falls steadily to low on the right, so the function is decreasing between consecutive asymptotes rather than turning. The asymptotes sit where the tangent is zero, which is at zero and at every multiple of pi. Unlike the secant and the cosecant there is no excluded band: a cotangent branch passes through every real value between its two asymptotes.</desc>

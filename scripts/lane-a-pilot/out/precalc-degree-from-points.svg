<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="precalc-degree-from-points-t precalc-degree-from-points-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="precalc-degree-from-points-t">How many points fix a polynomial's degree</title>
<desc id="precalc-degree-from-points-d">Four marked points with distinct horizontal positions, at x equals minus one, zero, one and two, with a single smooth cubic curve passing through all four. Four points with distinct inputs determine a polynomial of degree three or less. Degree three OR LESS matters: if the four points happened to lie on a straight line, the polynomial through them would be degree one, and the count of points sets an upper bound on the degree rather than fixing it exactly.</desc>

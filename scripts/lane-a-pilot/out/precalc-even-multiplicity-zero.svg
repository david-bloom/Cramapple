<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="precalc-even-multiplicity-zero-t precalc-even-multiplicity-zero-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="precalc-even-multiplicity-zero-t">A zero of even multiplicity</title>
<desc id="precalc-even-multiplicity-zero-d">The graph of a cubic with two zeros. At x equals minus two the curve passes straight through the horizontal axis, going from negative to positive, because that zero has multiplicity one. At x equals one the curve comes down to the axis, touches it, and turns back upwards without crossing: that zero has multiplicity two. Either side of x equals one the output is positive, so the sign does not change there, and the curve is tangent to the axis at that point rather than cutting it. Even multiplicity means touch; odd multiplicity means cross.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="precalc-exponential-shape-t precalc-exponential-shape-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="precalc-exponential-shape-t">The shape of an exponential function</title>
<desc id="precalc-exponential-shape-d">The graph of two to the power x, rising from near zero on the left to eight on the right. It increases at every point and is concave up at every point, so it never turns around and never changes the direction of its bend. That is why an exponential function has no maximum, no minimum and no point of inflection, except that a maximum and minimum do exist if you restrict it to a closed interval, where they occur at the endpoints. The dashed line at y equals zero is a horizontal asymptote: the curve approaches it without ever reaching it.</desc>

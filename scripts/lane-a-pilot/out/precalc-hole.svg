<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="precalc-hole-t precalc-hole-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="precalc-hole-t">A hole in a rational function</title>
<desc id="precalc-hole-d">A straight line rising from lower left to upper right, with a single open circle at the point two comma four. The function is a rational expression whose numerator and denominator share a factor, so it equals x plus two everywhere except at x equals two, where it is undefined. Inputs just below and just above two both give outputs arbitrarily close to four, so the limit from each side is four and the hole sits at the point two comma four. The circle is drawn open, not filled, because the function does not take that value: a filled dot would say the opposite.</desc>

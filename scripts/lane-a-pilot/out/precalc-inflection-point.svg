<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="precalc-inflection-point-t precalc-inflection-point-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="precalc-inflection-point-t">A point of inflection</title>
<desc id="precalc-inflection-point-d">The graph of a cubic with a single marked point at the origin, labelled as the point of inflection. To the left of that point the curve is concave down and to the right it is concave up, so the marked point is where the concavity changes. It is not a maximum or a minimum: the function is increasing on both sides of it. What switches there is the direction of the bend, which is the same as saying the rate of change stops decreasing and starts increasing.</desc>

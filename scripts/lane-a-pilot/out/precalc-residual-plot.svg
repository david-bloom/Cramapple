<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="ttl desc" font-family="Helvetica Neue, Arial, sans-serif">
<title id="ttl">Residual plot</title>
<desc id="desc">A residual plot: ten points showing the residual, the actual value minus the value the model predicts, against the independent variable. A horizontal line marks a residual of zero. The points fall on both sides of that line, close to it, with no curve, no fanning and no trend across the plot. That absence of a pattern is what justifies the model as an appropriate fit. Illustrative data.</desc>
<rect width="980" height="620" fill="#FAFAF8"/>
<line x1="112" y1="419.2" x2="920" y2="419.2" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="298.0" x2="920" y2="298.0" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="176.8" x2="920" y2="176.8" stroke="#D8D8D3" stroke-width="0.8"/>
<circle cx="185.5" cy="346.5" r="5.5" fill="#151515" fill-opacity="0.9"/>
<circle cx="258.9" cy="213.1" r="5.5" fill="#151515" fill-opacity="0.9"/>
<circle cx="332.4" cy="237.4" r="5.5" fill="#151515" fill-opacity="0.9"/>
<circle cx="405.8" cy="395.0" r="5.5" fill="#151515" fill-opacity="0.9"/>
<circle cx="479.3" cy="334.4" r="5.5" fill="#151515" fill-opacity="0.9"/>
<circle cx="552.7" cy="188.9" r="5.5" fill="#151515" fill-opacity="0.9"/>
<circle cx="626.2" cy="370.8" r="5.5" fill="#151515" fill-opacity="0.9"/>
<circle cx="699.6" cy="273.8" r="5.5" fill="#151515" fill-opacity="0.9"/>
<circle cx="773.1" cy="382.9" r="5.5" fill="#151515" fill-opacity="0.9"/>
<circle cx="846.5" cy="225.2" r="5.5" fill="#151515" fill-opacity="0.9"/>
<line x1="112" y1="298.0" x2="920" y2="298.0" stroke="#6E6E6E" stroke-width="1" stroke-dasharray="4 4"/>
<text x="916" y="290.0" text-anchor="end" font-size="11.5" fill="#6E6E6E">residual = 0</text>
<line x1="112" y1="104.0" x2="112" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<line x1="112" y1="492.0" x2="920" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<text x="516.0" y="546.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">INDEPENDENT VARIABLE</text>
<text transform="translate(80.7,298.0) rotate(-90)" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">RESIDUAL (ACTUAL − PREDICTED)</text>
<line x1="107" y1="419.2" x2="112" y2="419.2" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="423.2" text-anchor="end" font-size="10.5" fill="#6E6E6E">-1</text>
<line x1="107" y1="298.0" x2="112" y2="298.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="302.0" text-anchor="end" font-size="10.5" fill="#6E6E6E">0</text>
<line x1="107" y1="176.8" x2="112" y2="176.8" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="180.8" text-anchor="end" font-size="10.5" fill="#6E6E6E">1</text>
<line x1="112.0" y1="492.0" x2="112.0" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="112.0" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">0</text>
<line x1="295.6" y1="492.0" x2="295.6" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="295.6" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">2</text>
<line x1="479.3" y1="492.0" x2="479.3" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="479.3" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">5</text>
<line x1="662.9" y1="492.0" x2="662.9" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="662.9" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">8</text>
<line x1="846.5" y1="492.0" x2="846.5" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="846.5" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">10</text>
<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">RESIDUAL PLOT</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">Residuals against the independent variable, with no pattern</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="9.5" fill="#6E6E6E">A curve, or a long run of residuals with the same sign, says the model is the wrong shape; a funnel says the spread is not constant. Either is a pattern.</text>
</svg>
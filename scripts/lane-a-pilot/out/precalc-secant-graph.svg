<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="precalc-secant-graph-t precalc-secant-graph-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="precalc-secant-graph-t">The secant graph</title>
<desc id="precalc-secant-graph-d">The secant graph, drawn as separate U-shaped branches between vertical dashed asymptotes. Each asymptote sits where the cosine is zero, because secant is one over cosine and dividing by zero has no value. Every branch opens away from the horizontal axis, and no part of the graph lies strictly between minus one and one: the range is everything at or below minus one together with everything at or above one. The branches are broken at the asymptotes rather than joined across them.</desc>

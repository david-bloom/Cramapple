<line x1="112" y1="362.7" x2="920" y2="362.7" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="233.3" x2="920" y2="233.3" stroke="#D8D8D3" stroke-width="0.8"/>
<text x="848.2" y="301.0" text-anchor="end" font-size="11.5" fill="#151515">straight trend</text>
<circle cx="156.9" cy="383.5" r="5.5" fill="#151515" fill-opacity="0.9"/>

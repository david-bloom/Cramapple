<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">JUSTIFYING AN EXPONENTIAL MODEL</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">For large inputs the logs of the outputs trend along a straight line</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">The straight trend matters for large inputs: the first two points sit a little above the line and an exponential model is still justified.</text>

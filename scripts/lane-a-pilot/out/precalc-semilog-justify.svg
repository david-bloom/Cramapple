<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="precalc-semilog-justify-t precalc-semilog-justify-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="precalc-semilog-justify-t">A straight semi-log trend justifies an exponential model</title>
<desc id="precalc-semilog-justify-d">A semi-log plot of nine data points with an ordinary horizontal axis from 1 to 9 and a logarithmic vertical axis marked 1, 10, 100 and 1,000. A dashed straight line runs up to the right. From x equal to 3 onward the points sit close to the line, while the first two points sit a little above it. Because the logarithms of the outputs trend linearly for large inputs, an exponential model is justified, and the first two points do not change that. Illustrative data.</desc>

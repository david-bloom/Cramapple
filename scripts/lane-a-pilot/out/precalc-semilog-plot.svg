<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="precalc-semilog-plot-t precalc-semilog-plot-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="precalc-semilog-plot-t">A semi-log plot of exponential data</title>
<desc id="precalc-semilog-plot-d">A semi-log plot: seven points of exponential data, with an ordinary horizontal axis from 0 to 6 and a logarithmic vertical axis marked 1, 10, 100 and 1,000 at equal spacing. The points rise from 5 to 320 and lie on a single straight line sloping up to the right. On a logarithmic axis a straight line means each step to the right multiplies the output by the same factor, here 2. Illustrative data.</desc>
<rect width="980" height="620" fill="#FAFAF8"/>
<line x1="112" y1="362.7" x2="920" y2="362.7" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="233.3" x2="920" y2="233.3" stroke="#D8D8D3" stroke-width="0.8"/>
<text x="677.6" y="272.3" text-anchor="start" font-size="11.5" fill="#151515">straight line</text>
<circle cx="112.0" cy="401.6" r="5.5" fill="#151515" fill-opacity="0.9"/>
<circle cx="236.3" cy="362.7" r="5.5" fill="#151515" fill-opacity="0.9"/>
<circle cx="360.6" cy="323.7" r="5.5" fill="#151515" fill-opacity="0.9"/>
<circle cx="484.9" cy="284.8" r="5.5" fill="#151515" fill-opacity="0.9"/>
<circle cx="609.2" cy="245.9" r="5.5" fill="#151515" fill-opacity="0.9"/>
<circle cx="733.5" cy="206.9" r="5.5" fill="#151515" fill-opacity="0.9"/>
<circle cx="857.8" cy="168.0" r="5.5" fill="#151515" fill-opacity="0.9"/>
<path d="M 112.0,401.6 L 236.3,362.7 L 360.6,323.7 L 484.9,284.8 L 609.2,245.9 L 733.5,206.9 L 857.8,168.0" fill="none" stroke="#151515" stroke-width="2.6" stroke-linecap="round"/>
<line x1="112" y1="104.0" x2="112" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<line x1="112" y1="492.0" x2="920" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<text x="516.0" y="546.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">X</text>
<text transform="translate(63.4,298.0) rotate(-90)" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">Y (LOG SCALE)</text>
<line x1="107" y1="492.0" x2="112" y2="492.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="496.0" text-anchor="end" font-size="10.5" fill="#6E6E6E">1</text>
<line x1="107" y1="362.7" x2="112" y2="362.7" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="366.7" text-anchor="end" font-size="10.5" fill="#6E6E6E">10</text>
<line x1="107" y1="233.3" x2="112" y2="233.3" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="237.3" text-anchor="end" font-size="10.5" fill="#6E6E6E">100</text>
<line x1="107" y1="104.0" x2="112" y2="104.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="108.0" text-anchor="end" font-size="10.5" fill="#6E6E6E">1,000</text>
<line x1="112.0" y1="492.0" x2="112.0" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="112.0" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">0</text>
<line x1="236.3" y1="492.0" x2="236.3" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="236.3" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">1</text>
<line x1="360.6" y1="492.0" x2="360.6" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="360.6" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">2</text>
<line x1="484.9" y1="492.0" x2="484.9" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="484.9" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">3</text>
<line x1="609.2" y1="492.0" x2="609.2" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="609.2" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">4</text>
<line x1="733.5" y1="492.0" x2="733.5" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="733.5" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">5</text>
<line x1="857.8" y1="492.0" x2="857.8" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="857.8" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">6</text>
<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">SEMI-LOG PLOT</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">The vertical axis is logarithmic: equal steps up are equal factors</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">Equal distances up the axis are equal factors: the step from 10 to 100 is as tall as the step from 100 to 1,000.</text>
</svg>
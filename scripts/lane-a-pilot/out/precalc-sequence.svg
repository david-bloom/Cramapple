<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="precalc-sequence-t precalc-sequence-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="precalc-sequence-t">A sequence is a function on the whole numbers</title>
<desc id="precalc-sequence-d">Seven separate dots rising steadily from left to right, at horizontal positions zero through six and heights one, three, five, seven, nine, eleven and thirteen. This is the graph of a sequence, which is a function whose inputs are the whole numbers. The dots are not joined, because the sequence has no value between consecutive whole numbers: there is no term at n equals one and a half. Drawing a line through them would assert values the sequence does not have, which is the difference between a sequence and a function on the real numbers. The graph is therefore discrete.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="precalc-sinusoid-concavity-t precalc-sinusoid-concavity-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="precalc-sinusoid-concavity-t">A sinusoid alternates concavity</title>
<desc id="precalc-sinusoid-concavity-d">The sine curve drawn over two full periods, from zero to four pi. Over the first hump, between zero and pi, the graph is concave down: it bends downwards throughout, even while it is rising on the way up to the crest. Between pi and two pi it is concave up, bending upwards throughout. The pattern then repeats. The concavity changes exactly where the curve crosses its midline, at zero, pi, two pi, three pi and four pi, and those crossings are the points of inflection. Rising and falling is not the same as concave up and down: the curve is rising and concave down on the first quarter period.</desc>

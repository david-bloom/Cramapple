<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="precalc-tangent-reflections-t precalc-tangent-reflections-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="precalc-tangent-reflections-t">A negative coefficient reflects the tangent graph</title>
<desc id="precalc-tangent-reflections-d">Two sets of tangent branches between vertical dashed asymptotes. The solid branches rise from bottom left to top right between consecutive asymptotes; the dashed branches are their mirror image in the horizontal axis, falling instead of rising. That mirror image is y equals minus tangent theta: a negative coefficient outside the function reflects the graph over the x-axis. A negative coefficient inside, as in tangent of b theta with b negative, reflects over the y-axis instead; for tangent those two reflections happen to produce the same curve, because tangent is an odd function, so minus tangent theta and tangent of minus theta are equal. The curves are broken at each asymptote rather than drawn through it, because the function has no value there.</desc>

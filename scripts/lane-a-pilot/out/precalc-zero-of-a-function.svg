<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="precalc-zero-of-a-function-t precalc-zero-of-a-function-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="precalc-zero-of-a-function-t">A zero of a function</title>
<desc id="precalc-zero-of-a-function-d">The graph of a quadratic that crosses the horizontal axis twice, at x equals minus one and x equals two, with both crossings marked. A zero of a function is an input whose output is zero, so on a graph it is exactly where the curve meets the x-axis. Between the two zeros the curve dips below the axis, so the output is negative there; outside them it is positive. A zero is an INPUT value, not a point: the points here are (minus one, zero) and (two, zero).</desc>

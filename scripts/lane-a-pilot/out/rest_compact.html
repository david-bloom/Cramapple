<title id="ttl">PV diagram: the isotherm and the work</title>
<desc id="desc">A pressure-versus-volume diagram for a gas. A single curve falls from upper left to lower right along an isotherm, a line of constant temperature on which the product of pressure and volume is the same at every point. The region between the curve and the volume axis, between the starting and finishing volumes, is shaded: its area is the magnitude of the work for the process. The axes carry no numbers because the diagram teaches the shape, not a measurement. Illustrative data.</desc>

<title id="ttl">PV diagram: the four special processes</title>
<desc id="desc">A pressure-versus-volume diagram showing four processes leaving the same starting state. The isovolumetric process is a vertical line, because the volume does not change. The isobaric process is a horizontal line, because the pressure does not change. The isothermal process follows the isotherm, on which pressure times volume is constant. The adiabatic process starts at the same point but falls more steeply than the isotherm, because no energy is transferred thermally. Illustrative data.</desc>

<title id="ttl">Reading x(t), v(t) and a(t) together</title>
<desc id="desc">Three stacked graphs of the same motion against a shared time axis. The top panel is position against time, a curve whose tangent is drawn at one instant: the slope of that tangent is the instantaneous velocity. The middle panel is velocity against time, a straight line whose own slope is the constant acceleration, with the area under it between two times shaded, because that area is the displacement over the interval. The bottom panel is acceleration against time, a horizontal line, whose area over an interval is the change in velocity. Illustrative data.</desc>

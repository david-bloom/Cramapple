<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="stats-association-no-t stats-association-no-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="stats-association-no-t">Distributions that match: no association in these data</title>
<desc id="stats-association-no-d">A segmented bar chart comparing exam results for two groups of students. Among the 50 students with a part-time job, 70% pass and 30% do not. Among the 40 students without one, 70% pass and 30% do not. The two distributions of results are the same, so in these data the variables are not associated. Illustrative data.</desc>
<rect width="980" height="620" fill="#FAFAF8"/>
<line x1="112" y1="395.0" x2="920" y2="395.0" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="298.0" x2="920" y2="298.0" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="201.0" x2="920" y2="201.0" stroke="#D8D8D3" stroke-width="0.8"/>
<rect x="124.1" y="220.4" width="379.8" height="271.6" fill="#151515" fill-opacity="1.0"/>
<text x="314.0" y="360.3" text-anchor="middle" font-size="11.5" fill="#FAFAF8">70%</text>
<rect x="124.1" y="104.0" width="379.8" height="116.4" fill="#B9B9B9" fill-opacity="1.0" stroke="#151515" stroke-width="1.1"/>
<text x="314.0" y="166.3" text-anchor="middle" font-size="11.5" fill="#151515">30%</text>
<rect x="528.1" y="220.4" width="379.8" height="271.6" fill="#151515" fill-opacity="1.0"/>
<text x="718.0" y="360.3" text-anchor="middle" font-size="11.5" fill="#FAFAF8">70%</text>
<rect x="528.1" y="104.0" width="379.8" height="116.4" fill="#B9B9B9" fill-opacity="1.0" stroke="#151515" stroke-width="1.1"/>
<text x="718.0" y="166.3" text-anchor="middle" font-size="11.5" fill="#151515">30%</text>
<line x1="112" y1="104.0" x2="112" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<line x1="112" y1="492.0" x2="920" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<text x="516.0" y="546.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">PART-TIME JOB</text>
<text transform="translate(69.2,298.0) rotate(-90)" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">SHARE OF THE GROUP</text>
<line x1="107" y1="492.0" x2="112" y2="492.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="496.0" text-anchor="end" font-size="10.5" fill="#6E6E6E">0%</text>

<line x1="314.0" y1="492.0" x2="314.0" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="314.0" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">Has a part-time job</text>
<line x1="718.0" y1="492.0" x2="718.0" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="718.0" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">No part-time job</text>
<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">ASSOCIATED IN THESE DATA</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">The pass rate differs between the two levels (figure 1 of 2)</text>

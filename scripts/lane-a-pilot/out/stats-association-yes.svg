<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="stats-association-yes-t stats-association-yes-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="stats-association-yes-t">Distributions that differ: associated in these data</title>
<desc id="stats-association-yes-d">A segmented bar chart comparing exam results for two groups of students. Among the 50 students with a part-time job, 60% pass and 40% do not. Among the 40 students without one, 80% pass and 20% do not. The two distributions of results differ, so in these data the variables are associated. Illustrative data.</desc>

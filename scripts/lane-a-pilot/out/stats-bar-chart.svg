<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="ttl desc" font-family="Helvetica Neue, Arial, sans-serif">
<title id="ttl">Bar chart of one categorical variable</title>
<desc id="desc">A bar chart with four separated bars, one for each way of travelling to school: car 18, bus 24, walk 12 and bike 6 students, out of 60. The bars stand apart because the variable is categorical, and the vertical axis is a count, so each bar's height is that category's frequency. Illustrative data.</desc>
<rect width="980" height="620" fill="#FAFAF8"/>
<line x1="112" y1="357.3" x2="920" y2="357.3" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="222.6" x2="920" y2="222.6" stroke="#D8D8D3" stroke-width="0.8"/>
<rect x="146.3" y="249.5" width="133.3" height="242.5" fill="#151515" fill-opacity="1.0"/>
<text x="213.0" y="374.9" text-anchor="middle" font-size="11.5" fill="#FAFAF8">18</text>
<rect x="348.3" y="168.7" width="133.3" height="323.3" fill="#151515" fill-opacity="1.0"/>
<text x="415.0" y="334.5" text-anchor="middle" font-size="11.5" fill="#FAFAF8">24</text>
<rect x="550.3" y="330.3" width="133.3" height="161.7" fill="#151515" fill-opacity="1.0"/>
<text x="617.0" y="415.3" text-anchor="middle" font-size="11.5" fill="#FAFAF8">12</text>
<rect x="752.3" y="411.2" width="133.3" height="80.8" fill="#151515" fill-opacity="1.0"/>
<text x="819.0" y="455.7" text-anchor="middle" font-size="11.5" fill="#FAFAF8">6</text>
<line x1="112" y1="104.0" x2="112" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<line x1="112" y1="492.0" x2="920" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<text x="516.0" y="546.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">HOW STUDENTS TRAVEL TO SCHOOL</text>
<text transform="translate(80.7,298.0) rotate(-90)" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">NUMBER OF STUDENTS</text>
<line x1="107" y1="492.0" x2="112" y2="492.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="496.0" text-anchor="end" font-size="10.5" fill="#6E6E6E">0</text>
<line x1="107" y1="357.3" x2="112" y2="357.3" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="361.3" text-anchor="end" font-size="10.5" fill="#6E6E6E">10</text>
<line x1="107" y1="222.6" x2="112" y2="222.6" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="226.6" text-anchor="end" font-size="10.5" fill="#6E6E6E">20</text>
<line x1="213.0" y1="492.0" x2="213.0" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="213.0" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">Car</text>
<line x1="415.0" y1="492.0" x2="415.0" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="415.0" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">Bus</text>
<line x1="617.0" y1="492.0" x2="617.0" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="617.0" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">Walk</text>
<line x1="819.0" y1="492.0" x2="819.0" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="819.0" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">Bike</text>
<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">BAR CHART</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">One bar per category; height is that category's frequency</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">Separated bars because the categories have no order. The same heights can show relative frequency instead: 30%, 40%, 20%, 10%.</text>
</svg>
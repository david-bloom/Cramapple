<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="ttl desc" font-family="Helvetica Neue, Arial, sans-serif">
<title id="ttl">Boxplot of the five-number summary</title>
<desc id="desc">A horizontal boxplot of the nightly homework times of 22 students. The box runs from the first quartile at 18 minutes to the third quartile at 30 minutes, with the median line inside it at 22.5 minutes. The left whisker reaches the minimum at 12 minutes and the right whisker stops at 36 minutes, which is the largest value that is not an outlier, rather than at the 48-minute fence. Two outliers at 58 and 62 minutes are marked separately with asterisks. Illustrative data.</desc>
<rect width="980" height="620" fill="#FAFAF8"/>
<rect x="268.4" y="232.0" width="156.4" height="116.4" fill="#B9B9B9" fill-opacity="0.45" stroke="#151515" stroke-width="2.1"/>
<line x1="327.0" y1="232.0" x2="327.0" y2="348.4" stroke="#151515" stroke-width="3.4"/>
<line x1="190.2" y1="290.2" x2="268.4" y2="290.2" stroke="#151515" stroke-width="2.3"/>
<line x1="424.8" y1="290.2" x2="503.0" y2="290.2" stroke="#151515" stroke-width="2.3"/>
<line x1="190.2" y1="256.5" x2="190.2" y2="324.0" stroke="#151515" stroke-width="2.3"/>
<line x1="503.0" y1="256.5" x2="503.0" y2="324.0" stroke="#151515" stroke-width="2.3"/>
<text x="789.7" y="295.1" text-anchor="middle" font-size="17.2" fill="#151515">*</text>
<text x="841.8" y="295.1" text-anchor="middle" font-size="17.2" fill="#151515">*</text>
<line x1="112" y1="492.0" x2="920" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<text x="516.0" y="546.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">MINUTES OF HOMEWORK PER NIGHT</text>
<line x1="164.1" y1="492.0" x2="164.1" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="164.1" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">10</text>
<line x1="294.5" y1="492.0" x2="294.5" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="294.5" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">20</text>
<line x1="424.8" y1="492.0" x2="424.8" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="424.8" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">30</text>
<line x1="555.1" y1="492.0" x2="555.1" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="555.1" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">40</text>
<line x1="685.4" y1="492.0" x2="685.4" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="685.4" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">50</text>
<line x1="815.7" y1="492.0" x2="815.7" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="815.7" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">60</text>
<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">BOXPLOT</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">Box from Q1 to Q3, median line inside, whiskers to the extreme non-outliers</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">The right whisker stops at 36, the most extreme value that is not an outlier - not at the 48-minute fence.</text>
</svg>
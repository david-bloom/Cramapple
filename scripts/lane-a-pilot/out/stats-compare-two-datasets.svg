<rect x="550.3" y="249.5" width="62.6" height="242.5" fill="#151515" fill-opacity="1.0"/>
<rect x="621.0" y="395.0" width="62.6" height="97.0" fill="#B9B9B9" fill-opacity="1.0" stroke="#151515" stroke-width="1.1"/>
<rect x="752.3" y="168.7" width="62.6" height="323.3" fill="#151515" fill-opacity="1.0"/>
<rect x="823.0" y="168.7" width="62.6" height="323.3" fill="#B9B9B9" fill-opacity="1.0" stroke="#151515" stroke-width="1.1"/>
<line x1="112" y1="104.0" x2="112" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<line x1="112" y1="492.0" x2="920" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<text x="516.0" y="546.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">HOW A STUDENT TRAVELS TO SCHOOL</text>
<text transform="translate(74.9,298.0) rotate(-90)" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">RELATIVE FREQUENCY</text>
<line x1="107" y1="492.0" x2="112" y2="492.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="496.0" text-anchor="end" font-size="10.5" fill="#6E6E6E">0%</text>
<line x1="107" y1="411.2" x2="112" y2="411.2" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="415.2" text-anchor="end" font-size="10.5" fill="#6E6E6E">10%</text>
<line x1="107" y1="330.3" x2="112" y2="330.3" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="334.3" text-anchor="end" font-size="10.5" fill="#6E6E6E">20%</text>
<line x1="107" y1="249.5" x2="112" y2="249.5" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="253.5" text-anchor="end" font-size="10.5" fill="#6E6E6E">30%</text>
<line x1="107" y1="168.7" x2="112" y2="168.7" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="172.7" text-anchor="end" font-size="10.5" fill="#6E6E6E">40%</text>
<line x1="213.0" y1="492.0" x2="213.0" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="213.0" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">Walk</text>
<line x1="415.0" y1="492.0" x2="415.0" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="415.0" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">Bike</text>
<line x1="617.0" y1="492.0" x2="617.0" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="617.0" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">Bus</text>
<line x1="819.0" y1="492.0" x2="819.0" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="819.0" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">Car</text>
<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">TWO DATA SETS, ONE VARIABLE</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">Relative frequencies, so groups of different sizes can be compared</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">Relative frequencies, not counts, because the classes have 40 and 25 students.</text>
<rect x="112.0" y="81.0" width="26" height="11" fill="#151515" fill-opacity="1.0"/>
<text x="148.0" y="92.0" font-size="11.5" fill="#151515">Class A (40 students)</text>
<rect x="302.8" y="81.0" width="26" height="11" fill="#B9B9B9" fill-opacity="1.0" stroke="#151515" stroke-width="1"/>
<text x="338.8" y="92.0" font-size="11.5" fill="#151515">Class B (25 students)</text>
</svg>
<line x1="112" y1="249.5" x2="920" y2="249.5" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="168.7" x2="920" y2="168.7" stroke="#D8D8D3" stroke-width="0.8"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="stats-compare-two-datasets-t stats-compare-two-datasets-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="stats-compare-two-datasets-t">Comparing two data sets on one categorical variable</title>
<desc id="stats-compare-two-datasets-d">A side-by-side bar chart of relative frequencies for how students travel to school, for two classes. Class A has 40 students: 20% walk, 10% bike, 30% take the bus and 40% go by car. Class B has 25 students: 40% walk, 8% bike, 12% take the bus and 40% go by car. Both classes use the same four categories, so each pair of bars compares the classes. Illustrative data.</desc>

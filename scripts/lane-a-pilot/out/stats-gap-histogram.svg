<rect x="785.3" y="421.5" width="134.7" height="70.5" fill="#151515" fill-opacity="1.0" stroke="#FAFAF8" stroke-width="1.1"/>
<line x1="516.0" y1="136.9" x2="650.7" y2="136.9" stroke="#6E6E6E" stroke-width="1.1"/>
<line x1="516.0" y1="131.9" x2="516.0" y2="141.9" stroke="#6E6E6E" stroke-width="1.1"/>
<line x1="650.7" y1="131.9" x2="650.7" y2="141.9" stroke="#6E6E6E" stroke-width="1.1"/>
<text x="583.3" y="127.9" text-anchor="middle" font-size="11.5" fill="#151515">gap: no data</text>
<line x1="112" y1="104.0" x2="112" y2="492.0" stroke="#151515" stroke-width="1.2"/>

<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">GAP IN A HISTOGRAM</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">One interval between two values holds no observations</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">A gap is an interval between two values with no observed data, so the bars on either side of it are separated by an empty bin.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="stats-gap-histogram-t stats-gap-histogram-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="stats-gap-histogram-t">A gap in a histogram</title>
<desc id="stats-gap-histogram-d">A histogram of the ages of 38 customers in six bins of ten years from 10 to 70. The bar heights are 7, 14, 9, 0, 5 and 3 customers, so the bin from 40 to 50 years has no bar: no customer in the data is between those two ages. That empty interval between two filled ones is a gap. Illustrative data.</desc>

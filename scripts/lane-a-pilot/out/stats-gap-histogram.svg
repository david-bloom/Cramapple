<line x1="785.3" y1="492.0" x2="785.3" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="785.3" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">60</text>

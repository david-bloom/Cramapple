<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">HISTOGRAM</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">Ordered bins along the axis; bars meet because the variable is quantitative</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">Bin width is 10 minutes here; widening or narrowing the bins can change the histogram's apparent shape.</text>
</svg>
<line x1="381.3" y1="136.9" x2="516.0" y2="136.9" stroke="#6E6E6E" stroke-width="1.1"/>
<line x1="381.3" y1="131.9" x2="381.3" y2="141.9" stroke="#6E6E6E" stroke-width="1.1"/>
<line x1="516.0" y1="131.9" x2="516.0" y2="141.9" stroke="#6E6E6E" stroke-width="1.1"/>
<text x="448.7" y="127.9" text-anchor="middle" font-size="11.5" fill="#151515">bin width = 10 min</text>
<line x1="112" y1="104" x2="112" y2="492.0" stroke="#151515" stroke-width="1.2"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="ttl desc" font-family="Helvetica Neue, Arial, sans-serif">
<title id="ttl">Histogram of a quantitative variable</title>
<desc id="desc">A histogram of the commute times of 50 adults, in six bins of ten minutes from 0 to 60. The bar heights are 4, 11, 15, 10, 7 and 3 adults, so the distribution peaks in the 20 to 30 minute bin and trails off to the right. The bars touch, because the bins are adjoining intervals of a quantitative variable rather than separate categories. Illustrative data.</desc>

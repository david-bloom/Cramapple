<title id="stats-mean-median-right-t">Skewed right: the mean is above the median</title>
<desc id="stats-mean-median-right-d">A right-skewed density curve with two dashed vertical lines. The median is the left line, at about 3.4, and the mean is the right line, at about 4.0, so the mean is larger than the median. The long right tail pulls the mean toward larger values. Illustrative data.</desc>

<title id="stats-mean-median-symmetric-t">Relatively symmetric: the mean and median are close</title>
<desc id="stats-mean-median-symmetric-d">A bell-shaped density curve with one dashed vertical line through the centre, at about 8. The mean and the median are at the same place, so they are close together. With no long tail pulling either way, the distribution is relatively symmetric. Illustrative data.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="stats-normal-curve-t stats-normal-curve-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="stats-normal-curve-t">The normal distribution</title>
<desc id="stats-normal-curve-d">A smooth bell-shaped curve over a horizontal value axis, with mean 60 and standard deviation 10. It has a single peak, at the mean, and the half to the left of the mean is a mirror image of the half to the right, so the mean and the median sit at the same place. The curve never touches the axis but gets very low beyond about 30 and 90. Marks at 50 and 70 show one standard deviation either side of the mean: those are the points where the curve stops bending downwards and starts bending upwards, which is what the standard deviation measures on this picture. The vertical axis is a density, not a count, so heights are not probabilities; areas are. Illustrative data.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="ttl desc" font-family="Helvetica Neue, Arial, sans-serif">
<title id="ttl">Pie chart of one categorical variable</title>
<desc id="desc">A pie chart of how 60 students travel to school, divided into four slices: bus 40%, car 30%, walk 20% and bike 10%. Each slice's share of the circle's area is that category's relative frequency, and the four slices together make up the whole circle, or 100%. Illustrative data.</desc>
<rect width="980" height="620" fill="#FAFAF8"/>
<path d="M 516.0,298.0 L 516.0,127.3 A 170.7,170.7 0 0 1 678.4,350.8 Z" fill="#151515" fill-opacity="1.0" stroke="#151515" stroke-width="1.2"/>
<text x="687.3" y="173.6" text-anchor="start" font-size="11.5" fill="#151515">Car 30%</text>
<path d="M 516.0,298.0 L 678.4,350.8 A 170.7,170.7 0 0 1 353.6,350.8 Z" fill="#B9B9B9" fill-opacity="1.0" stroke="#151515" stroke-width="1.2"/>
<text x="516.0" y="509.7" text-anchor="middle" font-size="11.5" fill="#151515">Bus 40%</text>
<path d="M 516.0,298.0 L 353.6,350.8 A 170.7,170.7 0 0 1 415.7,159.9 Z" fill="#6E6E6E" fill-opacity="1.0" stroke="#151515" stroke-width="1.2"/>
<text x="314.7" y="232.6" text-anchor="end" font-size="11.5" fill="#151515">Walk 20%</text>
<path d="M 516.0,298.0 L 415.7,159.9 A 170.7,170.7 0 0 1 516.0,127.3 Z" fill="#B9B9B9" fill-opacity="0.45" stroke="#151515" stroke-width="1.2"/>
<text x="450.6" y="96.7" text-anchor="end" font-size="11.5" fill="#151515">Bike 10%</text>
<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">PIE CHART</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">Each slice's share of the area is that category's relative frequency</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">The four slices sum to 100% of the area, which is what makes a pie chart a display of relative frequency.</text>
</svg>
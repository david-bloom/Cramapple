<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="stats-pvalue-left-tail-t stats-pvalue-left-tail-d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="stats-pvalue-left-tail-t">p-value for Ha: less than</title>
<desc id="stats-pvalue-left-tail-d">A standard normal null distribution with the region from the observed test statistic of minus 1.4 leftwards shaded. The p-value for an alternative hypothesis of the less-than form is that left-hand tail area alone, about 0.081. It is the probability of getting a result at least as far below the null value as the one observed, if the null hypothesis were true. The direction of the shading follows the direction of the alternative, not the sign of the statistic. Illustrative data.</desc>

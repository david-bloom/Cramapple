<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="ttl desc" font-family="Helvetica Neue, Arial, sans-serif">
<title id="ttl">Stem-and-leaf plot</title>
<desc id="desc">A stem-and-leaf plot of sixteen test scores. The stems 5, 6, 7, 8 and 9 are the tens digits, listed in order down the left of a rule, and each stem's leaves are the units digits in order to its right: 5 gives 2 and 5; 6 gives 1, 3 and 7; 7 gives 0, 2, 4, 8 and 9; 8 gives 1, 5 and 8; 9 gives 1, 3 and 6. The key reads 5 bar 2 means 52, so the plot keeps every original value. Illustrative data.</desc>
<rect width="980" height="620" fill="#FAFAF8"/>
<text x="322.1" y="157.9" text-anchor="end" font-size="33.4" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#151515">5</text>
<line x1="340.5" y1="125.6" x2="340.5" y2="166.5" stroke="#6E6E6E" stroke-width="1.1"/>
<text x="360.5" y="157.9" font-size="33.4" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#151515" letter-spacing="0.12em">2 5</text>
<text x="322.1" y="211.8" text-anchor="end" font-size="33.4" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#151515">6</text>
<line x1="340.5" y1="179.4" x2="340.5" y2="220.4" stroke="#6E6E6E" stroke-width="1.1"/>
<text x="360.5" y="211.8" font-size="33.4" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#151515" letter-spacing="0.12em">1 3 7</text>
<text x="322.1" y="265.7" text-anchor="end" font-size="33.4" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#151515">7</text>
<line x1="340.5" y1="233.3" x2="340.5" y2="274.3" stroke="#6E6E6E" stroke-width="1.1"/>
<text x="360.5" y="265.7" font-size="33.4" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#151515" letter-spacing="0.12em">0 2 4 8 9</text>
<text x="322.1" y="319.6" text-anchor="end" font-size="33.4" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#151515">8</text>
<line x1="340.5" y1="287.2" x2="340.5" y2="328.2" stroke="#6E6E6E" stroke-width="1.1"/>
<text x="360.5" y="319.6" font-size="33.4" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#151515" letter-spacing="0.12em">1 5 8</text>
<text x="322.1" y="373.4" text-anchor="end" font-size="33.4" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#151515">9</text>
<line x1="340.5" y1="341.1" x2="340.5" y2="382.1" stroke="#6E6E6E" stroke-width="1.1"/>
<text x="360.5" y="373.4" font-size="33.4" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#151515" letter-spacing="0.12em">1 3 6</text>
<text x="121.4" y="470.4" font-size="17.4" fill="#6E6E6E">Key:  5 | 2  means 52</text>
<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">STEM-AND-LEAF PLOT</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">Each value split into a stem and a single-digit leaf, both ordered</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">Unlike a histogram, no information is lost: every individual value can be read back off the plot.</text>
</svg>
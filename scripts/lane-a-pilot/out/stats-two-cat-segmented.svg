<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="ttl desc" font-family="Helvetica Neue, Arial, sans-serif">
<title id="ttl">Segmented bar chart</title>
<desc id="desc">A segmented bar chart of the same 150 students. Each year group is one bar of equal width, divided into the share that plays a school sport and the share that does not: 60% and 40% for freshmen, 45% and 55% for sophomores, 60% and 40% for juniors. Every bar fills the full height, so the display compares proportions within each year group and the differing group sizes are not visible. Illustrative data.</desc>
<rect width="980" height="620" fill="#FAFAF8"/>
<line x1="112" y1="395.0" x2="920" y2="395.0" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="298.0" x2="920" y2="298.0" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="201.0" x2="920" y2="201.0" stroke="#D8D8D3" stroke-width="0.8"/>
<rect x="120.1" y="259.2" width="253.2" height="232.8" fill="#151515" fill-opacity="1.0"/>
<text x="246.7" y="379.7" text-anchor="middle" font-size="11.5" fill="#FAFAF8">60%</text>
<rect x="120.1" y="104.0" width="253.2" height="155.2" fill="#B9B9B9" fill-opacity="1.0" stroke="#151515" stroke-width="1.1"/>
<text x="246.7" y="185.7" text-anchor="middle" font-size="11.5" fill="#151515">40%</text>
<rect x="389.4" y="317.4" width="253.2" height="174.6" fill="#151515" fill-opacity="1.0"/>
<text x="516.0" y="408.8" text-anchor="middle" font-size="11.5" fill="#FAFAF8">45%</text>
<rect x="389.4" y="104.0" width="253.2" height="213.4" fill="#B9B9B9" fill-opacity="1.0" stroke="#151515" stroke-width="1.1"/>
<text x="516.0" y="214.8" text-anchor="middle" font-size="11.5" fill="#151515">55%</text>
<rect x="658.7" y="259.2" width="253.2" height="232.8" fill="#151515" fill-opacity="1.0"/>
<text x="785.3" y="379.7" text-anchor="middle" font-size="11.5" fill="#FAFAF8">60%</text>
<rect x="658.7" y="104.0" width="253.2" height="155.2" fill="#B9B9B9" fill-opacity="1.0" stroke="#151515" stroke-width="1.1"/>
<text x="785.3" y="185.7" text-anchor="middle" font-size="11.5" fill="#151515">40%</text>
<line x1="112" y1="104.0" x2="112" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<line x1="112" y1="492.0" x2="920" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<text x="516.0" y="546.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">YEAR GROUP</text>
<text transform="translate(69.2,298.0) rotate(-90)" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">SHARE OF THE YEAR GROUP</text>
<line x1="107" y1="492.0" x2="112" y2="492.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="496.0" text-anchor="end" font-size="10.5" fill="#6E6E6E">0%</text>
<line x1="107" y1="395.0" x2="112" y2="395.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="399.0" text-anchor="end" font-size="10.5" fill="#6E6E6E">25%</text>
<line x1="107" y1="298.0" x2="112" y2="298.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="302.0" text-anchor="end" font-size="10.5" fill="#6E6E6E">50%</text>
<line x1="107" y1="201.0" x2="112" y2="201.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="205.0" text-anchor="end" font-size="10.5" fill="#6E6E6E">75%</text>
<line x1="107" y1="104.0" x2="112" y2="104.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="108.0" text-anchor="end" font-size="10.5" fill="#6E6E6E">100%</text>
<line x1="246.7" y1="492.0" x2="246.7" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="246.7" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">Freshman</text>
<line x1="516.0" y1="492.0" x2="516.0" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="516.0" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">Sophomore</text>
<line x1="785.3" y1="492.0" x2="785.3" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="785.3" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">Junior</text>
<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">SEGMENTED BARS</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">One bar per category, divided into the levels of the other variable (figure 2 of 3)</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">Each bar is the same width and full height, so it shows proportions and hides how big each group is.</text>
<rect x="112.0" y="81.0" width="26" height="11" fill="#151515" fill-opacity="1.0"/>
<text x="148.0" y="92.0" font-size="11.5" fill="#151515">Plays a school sport</text>
<rect x="296.5" y="81.0" width="26" height="11" fill="#B9B9B9" fill-opacity="1.0" stroke="#151515" stroke-width="1"/>
<text x="332.5" y="92.0" font-size="11.5" fill="#151515">Does not</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="ttl desc" font-family="Helvetica Neue, Arial, sans-serif">
<title id="ttl">Side-by-side bar chart</title>
<desc id="desc">A side-by-side bar chart of 150 students by year group and whether they play a school sport. Within each year group a pair of bars shows the two levels: freshmen 24 who play against 16 who do not, sophomores 27 against 33, juniors 30 against 20. Because the bars show counts and the year groups differ in size, the pairs are compared within a group rather than across groups. Illustrative data.</desc>
<rect width="980" height="620" fill="#FAFAF8"/>
<line x1="112" y1="394.0" x2="920" y2="394.0" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="296.0" x2="920" y2="296.0" stroke="#D8D8D3" stroke-width="0.8"/>
<line x1="112" y1="198.1" x2="920" y2="198.1" stroke="#D8D8D3" stroke-width="0.8"/>
<rect x="157.8" y="256.8" width="83.5" height="235.2" fill="#151515" fill-opacity="1.0"/>
<rect x="252.1" y="335.2" width="83.5" height="156.8" fill="#B9B9B9" fill-opacity="1.0" stroke="#151515" stroke-width="1.1"/>
<rect x="427.1" y="227.5" width="83.5" height="264.5" fill="#151515" fill-opacity="1.0"/>
<rect x="521.4" y="168.7" width="83.5" height="323.3" fill="#B9B9B9" fill-opacity="1.0" stroke="#151515" stroke-width="1.1"/>
<rect x="696.5" y="198.1" width="83.5" height="293.9" fill="#151515" fill-opacity="1.0"/>
<rect x="790.7" y="296.0" width="83.5" height="196.0" fill="#B9B9B9" fill-opacity="1.0" stroke="#151515" stroke-width="1.1"/>
<line x1="112" y1="104.0" x2="112" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<line x1="112" y1="492.0" x2="920" y2="492.0" stroke="#151515" stroke-width="1.2"/>
<text x="516.0" y="546.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">YEAR GROUP</text>
<text transform="translate(80.7,298.0) rotate(-90)" text-anchor="middle" font-size="12.5" font-weight="700" fill="#151515" letter-spacing="0.08em">NUMBER OF STUDENTS</text>
<line x1="107" y1="492.0" x2="112" y2="492.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="496.0" text-anchor="end" font-size="10.5" fill="#6E6E6E">0</text>
<line x1="107" y1="394.0" x2="112" y2="394.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="398.0" text-anchor="end" font-size="10.5" fill="#6E6E6E">10</text>
<line x1="107" y1="296.0" x2="112" y2="296.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="300.0" text-anchor="end" font-size="10.5" fill="#6E6E6E">20</text>
<line x1="107" y1="198.1" x2="112" y2="198.1" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="102" y="202.1" text-anchor="end" font-size="10.5" fill="#6E6E6E">30</text>
<line x1="246.7" y1="492.0" x2="246.7" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="246.7" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">Freshman</text>
<line x1="516.0" y1="492.0" x2="516.0" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="516.0" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">Sophomore</text>
<line x1="785.3" y1="492.0" x2="785.3" y2="497.0" stroke="#6E6E6E" stroke-width="0.9"/>
<text x="785.3" y="514.0" text-anchor="middle" font-size="10.5" fill="#6E6E6E">Junior</text>
<text x="112" y="46.0" font-size="20" font-weight="700" fill="#151515" letter-spacing="0.03em">SIDE-BY-SIDE BARS</text>
<text x="112" y="70" font-size="12.5" fill="#6E6E6E">Bars for both levels shown within each category (figure 1 of 3)</text>
<text x="920" y="46" text-anchor="end" font-size="10" font-weight="700" fill="#6E6E6E" letter-spacing="0.1em">ILLUSTRATIVE</text>
<text x="920" y="604" text-anchor="end" font-size="10.5" fill="#6E6E6E">Counts, not proportions: the year groups have 40, 60 and 50 students, so compare within a pair.</text>
<rect x="112.0" y="81.0" width="26" height="11" fill="#151515" fill-opacity="1.0"/>

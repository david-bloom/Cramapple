<svg xmlns="http://www.w3.org/2000/svg" width="340" height="420" viewBox="0 0 340 420" role="img"><title>Equal-total segmented percentage bars for Chess and Art meeting preference.</title><rect width="340" height="420" fill="white"/><g font-family="Arial,sans-serif" font-size="26" fill="#151515"><text x="182" y="32" text-anchor="middle">Meeting preference</text><path d="M80 260H310" stroke="#ddd"/><text x="73" y="267" text-anchor="end" font-size="22">0</text><path d="M80 215H310" stroke="#ddd"/><text x="73" y="222" text-anchor="end" font-size="22">25</text><path d="M80 170H310" stroke="#ddd"/><text x="73" y="177" text-anchor="end" font-size="22">50</text><path d="M80 125H310" stroke="#ddd"/><text x="73" y="132" text-anchor="end" font-size="22">75</text><path d="M80 80H310" stroke="#ddd"/><text x="73" y="87" text-anchor="end" font-size="22">100</text><path d="M80 75V260H310" fill="none" stroke="#151515" stroke-width="2"/><text x="0" y="0" transform="translate(26 175) rotate(-90)" text-anchor="middle">Percent</text><rect x="105" y="80" width="60" height="180" fill="#eee" stroke="#151515"/><rect x="105" y="188" width="60" height="72" fill="#777" stroke="#151515"/><text x="135" y="232" text-anchor="middle">40%</text><text x="135" y="142" text-anchor="middle">60%</text><text x="135" y="295" text-anchor="middle">Chess</text><rect x="235" y="80" width="60" height="180" fill="#eee" stroke="#151515"/><rect x="235" y="125" width="60" height="135" fill="#777" stroke="#151515"/><text x="265" y="200.5" text-anchor="middle">75%</text><text x="265" y="110.5" text-anchor="middle">25%</text><text x="265" y="295" text-anchor="middle">Art</text><rect x="70" y="325" width="26" height="26" fill="#777" stroke="#151515"/><text x="110" y="348" >Online</text><rect x="70" y="370" width="26" height="26" fill="#eee" stroke="#151515"/><text x="110" y="393" >Not online</text></g></svg>
